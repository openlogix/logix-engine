<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 728" role="img" aria-label="Every host reaches the same engine through MCP" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .edge { stroke: #8c959f; }
    .arrow { fill: #8c959f; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .accent { stroke: #0969da; fill: #0969da; fill-opacity: 0.08; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .edge { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .accent { stroke: #4493f8; fill: #4493f8; fill-opacity: 0.12; }
    }
    .box { fill: none; stroke-width: 1.25; }
    .dash { stroke-dasharray: 4 4; }
    .name { font-weight: 600; }
    .sub { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="728"/>

  <text x="24" y="32" font-size="15" class="ink name">Every host reaches the same engine through MCP</text>

  <rect class="box edge" x="584" y="52" width="122" height="48" rx="8"/>
  <text x="645" y="72" text-anchor="middle" class="ink name">Browser apps</text>
  <text x="645" y="90" text-anchor="middle" class="quiet sub">remote labs</text>
  <text x="637" y="122" text-anchor="end" class="quiet sub">ongoing, MCP over HTTP</text>

  <rect class="box edge" x="24" y="132" width="712" height="112" rx="8"/>
  <text x="40" y="154" class="ink name">Hosts, in any language, all using MCP</text>
  <text x="40" y="172" class="quiet sub">Most simply call known tools; AI agents can also discover them</text>

  <g transform="translate(0,16)">
    <rect class="box edge" x="40" y="164" width="118" height="48" rx="8"/>
    <text x="99" y="184" text-anchor="middle" class="ink name">Desktop apps</text>
    <text x="99" y="202" text-anchor="middle" class="quiet sub">IDE extensions</text>

    <rect class="box edge" x="174" y="164" width="118" height="48" rx="8"/>
    <text x="233" y="184" text-anchor="middle" class="ink name">CLI tools</text>
    <text x="233" y="202" text-anchor="middle" class="quiet sub">scripts, CI</text>

    <rect class="box edge" x="308" y="164" width="118" height="48" rx="8"/>
    <text x="367" y="184" text-anchor="middle" class="ink name">HDL programs</text>
    <text x="367" y="202" text-anchor="middle" class="quiet sub">Amaranth, LiteX</text>

    <rect class="box edge" x="442" y="164" width="118" height="48" rx="8"/>
    <text x="501" y="184" text-anchor="middle" class="ink name">AI agents</text>
    <text x="501" y="202" text-anchor="middle" class="quiet sub">LLM tool calls</text>

    <rect class="box edge dash" x="576" y="164" width="138" height="48" rx="8"/>
    <text x="645" y="184" text-anchor="middle" class="ink name">Network adapter</text>
    <text x="645" y="202" text-anchor="middle" class="quiet sub">nice to have</text>

    <g fill="none" stroke-width="1.25" class="edge">
      <path d="M645 84V164" marker-end="url(#arch-arrow)"/>
      <path d="M99 212V332" marker-end="url(#arch-arrow)"/>
      <path d="M233 212V332" marker-end="url(#arch-arrow)"/>
      <path d="M367 212V332" marker-end="url(#arch-arrow)"/>
      <path d="M501 212V332" marker-end="url(#arch-arrow)"/>
      <path d="M645 212V332" marker-end="url(#arch-arrow)"/>
      <path d="M380 424V440" marker-end="url(#arch-arrow)"/>
      <path d="M148 496V512" marker-end="url(#arch-arrow)"/>
      <path d="M380 496V512" marker-end="url(#arch-arrow)"/>
      <path d="M612 496V512" marker-end="url(#arch-arrow)"/>
      <path d="M148 568V616" marker-end="url(#arch-arrow)"/>
      <path d="M380 568V600H620V616" marker-end="url(#arch-arrow)"/>
      <path d="M472 660H520" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
    </g>

    <text x="91" y="270" text-anchor="end" class="quiet sub">ongoing</text>
    <text x="91" y="286" text-anchor="end" class="quiet sub">stdin/stdout</text>
    <text x="225" y="270" text-anchor="end" class="quiet sub">short session</text>
    <text x="225" y="286" text-anchor="end" class="quiet sub">stdin/stdout</text>
    <text x="359" y="270" text-anchor="end" class="quiet sub">ongoing</text>
    <text x="359" y="286" text-anchor="end" class="quiet sub">stdin/stdout</text>
    <text x="493" y="270" text-anchor="end" class="quiet sub">ongoing</text>
    <text x="493" y="286" text-anchor="end" class="quiet sub">stdin/stdout</text>
    <text x="637" y="270" text-anchor="end" class="quiet sub">ongoing</text>
    <text x="637" y="286" text-anchor="end" class="quiet sub">stdin/stdout</text>

    <rect class="accent" x="24" y="332" width="712" height="252" rx="8" stroke-width="2"/>
    <text x="40" y="356" class="ink name">FPGA Engine: one Rust binary per platform</text>

    <rect class="box edge" x="40" y="368" width="680" height="56" rx="8"/>
    <text x="380" y="392" text-anchor="middle" class="ink name">MCP interface</text>
    <text x="380" y="408" text-anchor="middle" class="quiet sub">MCP over stdin/stdout, sessions of any length</text>

    <rect class="box edge" x="40" y="440" width="680" height="56" rx="8"/>
    <text x="380" y="464" text-anchor="middle" class="ink name">Protocol core</text>
    <text x="380" y="480" text-anchor="middle" class="quiet sub">Tools with the engine schema, progress and cancellation</text>

    <rect class="box edge" x="40" y="512" width="216" height="56" rx="8"/>
    <text x="148" y="536" text-anchor="middle" class="ink name">Operation engine</text>
    <text x="148" y="552" text-anchor="middle" class="quiet sub">runs tools as subprocesses</text>

    <rect class="box edge" x="272" y="512" width="216" height="56" rx="8"/>
    <text x="380" y="536" text-anchor="middle" class="ink name">Package manager</text>
    <text x="380" y="552" text-anchor="middle" class="quiet sub">installs toolchain packages</text>

    <rect class="box edge" x="504" y="512" width="216" height="56" rx="8"/>
    <text x="612" y="536" text-anchor="middle" class="ink name">Catalog</text>
    <text x="612" y="552" text-anchor="middle" class="quiet sub">boards and FPGAs as data</text>

    <rect class="box edge" x="40" y="616" width="432" height="72" rx="8"/>
    <text x="256" y="640" text-anchor="middle" class="ink name">Open source FPGA tools</text>
    <text x="256" y="656" text-anchor="middle" class="quiet sub">Yosys, nextpnr, Icarus Verilog, Verilator,</text>
    <text x="256" y="672" text-anchor="middle" class="quiet sub">Verible, openFPGALoader</text>

    <rect class="box edge" x="520" y="616" width="200" height="72" rx="8"/>
    <text x="620" y="640" text-anchor="middle" class="ink name">Shared folders</text>
    <text x="620" y="656" text-anchor="middle" class="quiet sub">engine folder</text>
    <text x="620" y="672" text-anchor="middle" class="quiet sub">source and build folders</text>
  </g>
</svg>
