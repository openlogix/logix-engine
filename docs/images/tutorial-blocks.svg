<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-label="You talk to Claude Code, Claude Code uses Logix Engine, and the engine programs the board" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .edge { stroke: #8c959f; }
    .arrow { fill: #8c959f; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .accent { stroke: #0969da; fill: #0969da; fill-opacity: 0.08; }
    .tint { fill: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .edge { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .accent { stroke: #4493f8; fill: #4493f8; fill-opacity: 0.12; }
      .tint { fill: #161b22; }
    }
    .box { fill: none; stroke-width: 1.25; }
    .main { stroke-width: 2; }
    .name { font-weight: 600; }
    .sub { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="tut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="528"/>

  <text x="24" y="32" font-size="15" class="ink name">You describe it, Claude Code writes it, Logix Engine builds it and programs the board</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M380 112V150" marker-end="url(#tut-arrow)"/>
    <path d="M380 208V246" marker-end="url(#tut-arrow)"/>
    <path d="M380 408V446" marker-end="url(#tut-arrow)"/>
  </g>

  <rect class="box edge" x="160" y="56" width="440" height="56" rx="8"/>
  <text x="380" y="80" text-anchor="middle" class="ink name">You</text>
  <text x="380" y="98" text-anchor="middle" class="quiet sub">describe what you want, in your own words</text>
  <text x="392" y="135" class="quiet sub">prompts</text>

  <rect class="box edge" x="160" y="152" width="440" height="56" rx="8"/>
  <text x="380" y="176" text-anchor="middle" class="ink name">Claude Code</text>
  <text x="380" y="194" text-anchor="middle" class="quiet sub">writes the design files and asks the engine to check and build them</text>
  <text x="392" y="231" class="quiet sub">MCP</text>

  <rect class="box accent main" x="160" y="248" width="440" height="160" rx="8"/>
  <text x="380" y="272" text-anchor="middle" class="ink name">Logix Engine</text>
  <text x="380" y="290" text-anchor="middle" class="ink sub">lints, builds, tests, simulates and programs the board</text>
  <text x="380" y="306" text-anchor="middle" class="ink sub">knows the supported boards, their FPGAs and pins</text>
  <rect class="tint" x="176" y="320" width="408" height="72" rx="8"/>
  <rect class="box edge" x="176" y="320" width="408" height="72" rx="8"/>
  <text x="380" y="342" text-anchor="middle" class="ink name" font-size="12">Open source FPGA tools it downloads and runs</text>
  <text x="380" y="360" text-anchor="middle" class="quiet sub">Yosys, nextpnr, openXC7, Icarus Verilog, Verilator,</text>
  <text x="380" y="376" text-anchor="middle" class="quiet sub">Verible, openFPGALoader, GTKWave and more</text>
  <text x="392" y="431" class="quiet sub">USB cable</text>

  <rect class="box edge" x="160" y="448" width="440" height="56" rx="8"/>
  <text x="380" y="472" text-anchor="middle" class="ink name">FPGA board</text>
  <text x="380" y="490" text-anchor="middle" class="quiet sub">runs your design</text>
</svg>
