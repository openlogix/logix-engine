<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-label="You talk to Claude Code, Claude Code uses Logix Engine, and the engine programs the board" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .edge { stroke: #8c959f; }
    .arrow { fill: #8c959f; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .you { stroke: #0969da; fill: #0969da; fill-opacity: 0.08; }
    .agent { stroke: #d1580f; fill: #f97316; fill-opacity: 0.09; }
    .engine { stroke: #7c3aed; fill: #8b5cf6; fill-opacity: 0.09; }
    .tools { stroke: #a78bfa; fill: #ede9fe; }
    .board { stroke: #059669; fill: #10b981; fill-opacity: 0.10; }
    .you-ink { fill: #0550ae; }
    .agent-ink { fill: #b4460b; }
    .engine-ink { fill: #6d28d9; }
    .board-ink { fill: #047857; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .edge { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .you { stroke: #4493f8; fill: #4493f8; fill-opacity: 0.12; }
      .agent { stroke: #fb923c; fill: #fb923c; fill-opacity: 0.12; }
      .engine { stroke: #a78bfa; fill: #a78bfa; fill-opacity: 0.12; }
      .tools { stroke: #6d28d9; fill: #221a3a; }
      .board { stroke: #34d399; fill: #34d399; fill-opacity: 0.12; }
      .you-ink { fill: #79c0ff; }
      .agent-ink { fill: #fdba74; }
      .engine-ink { fill: #c4b5fd; }
      .board-ink { fill: #6ee7b7; }
    }
    .box { fill: none; stroke-width: 1.25; }
    .main { stroke-width: 2; }
    .name { font-weight: 600; }
    .sub { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="tut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="512"/>

  <text x="24" y="32" font-size="15" class="ink name">You describe it, Claude Code writes it, Logix Engine builds it and programs the board</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M380 112V150" marker-end="url(#tut-arrow)"/>
    <path d="M380 224V262" marker-end="url(#tut-arrow)"/>
    <path d="M380 392V430" marker-end="url(#tut-arrow)"/>
  </g>

  <rect class="you main" x="160" y="56" width="440" height="56" rx="8"/>
  <text x="380" y="80" text-anchor="middle" class="you-ink name">You</text>
  <text x="380" y="98" text-anchor="middle" class="quiet sub">describe what you want, in your own words</text>
  <text x="392" y="135" class="quiet sub">prompts</text>

  <rect class="agent main" x="160" y="152" width="440" height="72" rx="8"/>
  <text x="380" y="176" text-anchor="middle" class="agent-ink name">Claude Code</text>
  <text x="380" y="194" text-anchor="middle" class="quiet sub">writes the design files, and asks the engine to check them,</text>
  <text x="380" y="210" text-anchor="middle" class="quiet sub">build them and program the board</text>
  <text x="392" y="247" class="quiet sub">MCP</text>

  <rect class="engine main" x="160" y="264" width="440" height="128" rx="8"/>
  <text x="380" y="288" text-anchor="middle" class="engine-ink name">Logix Engine</text>
  <text x="380" y="306" text-anchor="middle" class="ink sub">lints, builds, tests, simulates and programs the board</text>
  <text x="380" y="322" text-anchor="middle" class="ink sub">knows the supported boards, their FPGAs and pins</text>
  <rect class="tools" stroke-width="1.25" x="176" y="336" width="408" height="40" rx="8"/>
  <text x="380" y="360" text-anchor="middle" class="ink name" font-size="12">Open source FPGA tools, downloaded and run by the engine</text>
  <text x="392" y="415" class="quiet sub">USB cable</text>

  <rect class="board main" x="160" y="432" width="440" height="56" rx="8"/>
  <text x="380" y="456" text-anchor="middle" class="board-ink name">FPGA board</text>
  <text x="380" y="474" text-anchor="middle" class="quiet sub">runs your design</text>
</svg>
