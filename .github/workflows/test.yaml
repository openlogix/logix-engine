# Runs all code checks and tests (scripts/test.sh).

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at the start of the UTC day, to catch breakage from new
    # runner images or tool versions even when the code doesn't change.
    - cron: "0 0 * * *"

permissions:
  contents: read

# A newer run for the same branch or PR replaces an older one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The remote config (remote-config/logix-engine/<NNN>/: channels.jsonc
  # and a config file per channel): the shared check (schemas, channels,
  # releases and files exist, SHA256SUMS lists them, prod.jsonc names only
  # stable releases, only openlogix repos on main). The tests below then run
  # once per config file, with what each names.
  remote-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check the remote config
        uses: openlogix/.github/actions/check-remote-config@main
        with:
          platforms: darwin-arm64 windows-x86-64

  # The channels the tests run on: one per config file in the newest version
  # folder (the website repo's CLAUDE.md, Remote updates, Channels): prod
  # alone in normal maintenance, dev too while dev.jsonc exists. Kept apart
  # from remote-config, so the tests neither wait for nor depend on its
  # network checks.
  channels:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.list.outputs.channels }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: List the channels
        id: list
        uses: openlogix/.github/actions/list-config-channels@main
        with:
          product: logix-engine

  test:
    name: test (${{ matrix.os }}, ${{ matrix.channel }})
    needs: channels
    # macOS on Apple Silicon: the only platform implemented so far, on each
    # macOS version GitHub offers (all arm64), named explicitly: add a new
    # one when GitHub ships it (macos-latest isn't listed: it's one of these,
    # so it tested the same image twice). Windows x64 (Milestone 3), named
    # explicitly too. Times each channel, so each config file's result shows
    # on its own and one failing doesn't stop the other. Add Linux with
    # Milestone 4.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2025]
        channel: ${{ fromJSON(needs.channels.outputs.channels) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Strict (the website repo's CLAUDE.md, Strict CI), but for one
    # temporary step: on the prod channel, Windows doesn't fail the run until
    # prod names logix-core 2026-11-13 or later (VERILATOR_ROOT on Windows).
    # Remove this with that promotion.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') && matrix.channel == 'prod' }}
    # Git's bash on Windows, as on macOS: the scripts are bash.
    defaults:
      run:
        shell: bash

    steps:
      # Files as in the repo, with LF line endings: Git on Windows
      # converts them to CRLF by default, which breaks the scripts' edits
      # and the tests that compare files.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out the code
        uses: actions/checkout@v7

      # CI only, until openXC7 fixes apio#1194
      # (https://github.com/FPGAwars/apio/issues/1194): its Windows
      # fasm2frames.cmd runs `python`, which a plain Windows, and so the
      # engine's tool PATH, doesn't have. A python.cmd in the Windows folder,
      # which is on that PATH, forwards to Python 3.12, the version its
      # packages are for. So the rest of the Xilinx flow stays tested. Remove
      # both steps with the fix (the website repo's CLAUDE.md, Strict CI).
      - name: Set up Python 3.12 for fasm2frames (apio#1194, CI only)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put python on the tools' PATH (apio#1194, CI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Set-Content -Path "$env:SystemRoot\python.cmd" -Value "@`"$py`" %*" -Encoding ascii
          & "$env:SystemRoot\python.cmd" --version

      # Installs the Rust version pinned in rust-toolchain.toml, with
      # rustfmt and clippy.
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The build tests download the toolchain package (about 526 MB) into
      # target/tmp/test-engine. Cached until the remote config changes.
      - name: Cache the test toolchain
        uses: actions/cache@v6
        with:
          path: target/tmp/test-engine/packages
          key: test-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remote-config/**') }}

      # On the matrix's channel: what its config file names.
      - name: Run checks and tests
        env:
          LOGIX_ENGINE_CHANNEL: ${{ matrix.channel }}
        run: scripts/test.sh
