# Builds the Logix Engine packages and publishes them as a GitHub
# pre-release tagged with the date (yyyy-mm-dd), which is also the engine
# version. A pre-release with the same tag is replaced, so the day's
# pre-release is from its latest commit; a stable release with that tag is
# never touched (the run fails instead). Old pre-releases are deleted by the
# shared policy.
#
# Runs on every push to main, daily, and manually. A newer run cancels a
# running one: only the latest commit's build matters.
#
# The shared parts are Open Logix actions in openlogix/.github (tested
# there): start-pre-release, read-build-info and publish-pre-release, which
# also writes the standard release text and applies the pre-release policy. macOS (Apple Silicon), and Windows (x64) while
# it's being ported (Milestone 3). Both must build (Strict CI, in the
# website repo's CLAUDE.md). Linux comes as another
# build-<platform>.yaml workflow (Milestone 4).

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, to minimize the risk of overstepping manual
  # builds of the same date.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  # Allow release creation.
  contents: write

# One build at a time; a newer one cancels the running one. If that happens
# while publishing, the newer run publishes the same date's pre-release
# again when it's done.
concurrency:
  group: build-pre-release
  cancel-in-progress: true

jobs:
  # ----- Collect the build parameters.

  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      # The remote config version this release reads, recorded in
      # BUILD-INFO.json: repos-janitor finds the releases a Latest release
      # uses by it (Repo types, in the website repo's CLAUDE.md).
      - name: Read the config version
        id: config
        run: |
          set -euo pipefail
          v="$(sed -n 's/^pub const CONFIG_VERSION: &str = "\([0-9]\{3\}\)";$/\1/p' src/packages/remote_config.rs)"
          [[ "$v" =~ ^[0-9]{3}$ ]] || { echo "::error::no CONFIG_VERSION in src/packages/remote_config.rs"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Start the pre-release
        uses: openlogix/.github/actions/start-pre-release@main
        with:
          package-name: logix-engine
          extra-fields: '{"config-version": "${{ steps.config.outputs.version }}"}'
          description: One open engine to build and test FPGA designs and program boards, for any IDE or AI agent.

  # ----- Per-platform builds, each on its own runner.

  build-darwin-arm64:
    needs: prepare
    uses: ./.github/workflows/build-darwin-arm64.yaml
    secrets: inherit

  build-windows-x86-64:
    needs: prepare
    uses: ./.github/workflows/build-windows-x86-64.yaml
    secrets: inherit

  # Linux while it's being ported (Milestone 4): the pre-release goes out
  # without it when it fails (the website repo's CLAUDE.md, Strict CI: a
  # stated, temporary step). Make it required like the others once Linux
  # works.
  build-linux-x86-64:
    needs: prepare
    uses: ./.github/workflows/build-linux-x86-64.yaml
    secrets: inherit

  # ----- Create the pre-release with the generated files.

  pre-release:
    needs: [prepare, build-darwin-arm64, build-windows-x86-64, build-linux-x86-64]
    # Without Linux when its build failed (above); never without the others.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-darwin-arm64.result == 'success' &&
      needs.build-windows-x86-64.result == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: logix-engine-*
          merge-multiple: true
          path: _artifacts

      - name: Scan the packages for viruses
        uses: openlogix/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: |
            _artifacts/logix-engine-*.tgz

      # The release text's own part; publish-pre-release adds the rest.
      - name: Write the release content
        run: |
          url="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          cat > CONTENT.md <<EOF
          Logix Engine is a single program, \`logix-engine\`, that an app or an AI agent starts and talks to over MCP. People using Logix IDE get it with the app: these steps are for using it on its own, such as with Claude Code. It's in development and not ready for general use yet.

          ---

          ### macOS (Apple Silicon)

          1. Download [logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz](${url}/logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz) to your **Downloads** folder.
          2. In **Terminal**, clear the download flag and unpack it. The engine isn't signed with an Apple Developer ID yet, and this tells macOS to allow it:
             \`\`\`
             cd ~/Downloads
             xattr -c logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz
             tar -xzf logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz
             \`\`\`
          3. Check that it runs: \`~/Downloads/logix-engine/logix-engine --version\` prints its version.
          4. To use it with Claude Code:
             \`\`\`
             claude mcp add -s user logix-engine -- ~/Downloads/logix-engine/logix-engine --engine-folder ~/.logix/claude-code/engine
             \`\`\`

          On its first use, the engine downloads the FPGA tools it needs into its engine folder, which also holds its logs. To uninstall, delete the \`logix-engine\` folder and the engine folder (\`~/.logix/claude-code/engine\`).

          EOF
          # Windows while it's being ported (Milestone 3): when it built.
          win="logix-engine-windows-x86-64-${PACKAGE_TAG}.tgz"
          if [[ -f "_artifacts/$win" ]]; then
            cat >> CONTENT.md <<EOF
          ---

          ### Windows (x64)

          1. Download [$win](${url}/$win) to your **Downloads** folder.
          2. In **PowerShell**, unblock it and unpack it. The engine isn't signed yet, and \`Unblock-File\` tells Windows the file is yours to run:
             \`\`\`
             cd \$HOME\\Downloads
             Unblock-File $win
             tar -xzf $win
             \`\`\`
          3. Check that it runs: \`& \$HOME\\Downloads\\logix-engine\\logix-engine.exe --version\` prints its version.
          4. To use it with Claude Code (the quotes around \`--\` keep PowerShell from dropping it):
             \`\`\`
             claude mcp add -s user logix-engine '--' \$HOME\\Downloads\\logix-engine\\logix-engine.exe --engine-folder \$HOME\\.logix\\claude-code\\engine
             \`\`\`

          On its first use, the engine downloads the FPGA tools it needs into its engine folder, which also holds its logs. To uninstall, delete the \`logix-engine\` folder and the engine folder (\`.logix\\claude-code\\engine\` in your user folder).

          EOF
            echo "FILES_WINDOWS=_artifacts/$win" >> "$GITHUB_ENV"
          else
            printf '%s\n\n%s\n\n%s\n\n' "---" "### Windows (x64)" "Not in this build: its build failed today." >> CONTENT.md
          fi
          # Linux while it's being ported (Milestone 4): when it built.
          lin="logix-engine-linux-x86-64-${PACKAGE_TAG}.tgz"
          if [[ -f "_artifacts/$lin" ]]; then
            cat >> CONTENT.md <<EOF
          ---

          ### Linux (x64)

          1. Download [$lin](${url}/$lin) to your **Downloads** folder.
          2. In a terminal, unpack it:
             \`\`\`
             cd ~/Downloads
             tar -xzf $lin
             \`\`\`
          3. Check that it runs: \`~/Downloads/logix-engine/logix-engine --version\` prints its version.
          4. To use it with Claude Code:
             \`\`\`
             claude mcp add -s user logix-engine -- ~/Downloads/logix-engine/logix-engine --engine-folder ~/.logix/claude-code/engine
             \`\`\`

          On its first use, the engine downloads the FPGA tools it needs into its engine folder, which also holds its logs. To uninstall, delete the \`logix-engine\` folder and the engine folder (\`~/.logix/claude-code/engine\`).
          EOF
            echo "FILES_LINUX=_artifacts/$lin" >> "$GITHUB_ENV"
          else
            printf '%s\n\n%s\n\n%s\n' "---" "### Linux (x64)" "Not in this build: its build failed today." >> CONTENT.md
          fi
          # A line before, between and after the platforms' sections, so
          # each is easy to find (the user's request, 2026-11-17).
          printf '\n%s\n' "---" >> CONTENT.md
          cat -n CONTENT.md

      - name: Publish the pre-release
        uses: openlogix/.github/actions/publish-pre-release@main
        with:
          title: "Logix Engine: One open engine to build and test FPGA designs and program boards, for any IDE or AI agent."
          links: "[Main page](https://www.openlogix.org/engine/) · [Docs](https://www.openlogix.org/logix-engine/)"
          content-file: CONTENT.md
          about-bullets: The release tag is also the engine version.
          files: |
            _artifacts/logix-engine-darwin-arm64-${{ env.PACKAGE_TAG }}.tgz
            ${{ env.FILES_WINDOWS }}
            ${{ env.FILES_LINUX }}
