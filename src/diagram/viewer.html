<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logix Diagram</title>
<!-- Written by Logix Engine's diagram tool. Self-contained: it needs no
     network and nothing installed. A host showing it in a window of its
     own offers the page contract, window.logixHost (docs/tool-api.md, Logix
     Viewer): a block's place in the source goes to openSource(file, line),
     and Export's images to saveAs(name, mime, data). In an iframe, it posts
     {type: "logix-diagram:open-source", file, line} when a block is
     double-clicked and {type: "logix-diagram:module", path} when the module
     changes, and accepts {type: "logix-diagram:theme", theme}.
     ?theme=light|dark sets the theme, #main/sub opens a module. -->
<style>
:root {
  /* The page's own colors are the waveform page's, so the engine's pages
     look alike (the user's request, 2026-11-22). */
  --bg: #f4f6f5; --surface: #ffffff; --ink: #15201e; --muted: #5c6b68; --line: #dde4e2;
  --soft: #edf2f0; --accent: #00838a; --accent-soft: #d8efee; --hover: #e0115f;
  --logix-diagram-sheet: #ffffff; --logix-diagram-wire: #23303c;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"], :root:not([data-theme="light"]).system-dark {
  --bg: #0c1110; --surface: #121918; --ink: #e2ebe9; --muted: #8b9d99; --line: #22302d;
  --soft: #19221f; --accent: #3cc8c0; --accent-soft: #143331; --hover: #ff5c93;
  --logix-diagram-sheet: #121a21; --logix-diagram-wire: #c9d6e2;
  --logix-diagram-register: #7fb0f5; --logix-diagram-register-fill: #172a45;
  --logix-diagram-arithmetic: #e8b04f; --logix-diagram-arithmetic-fill: #3a2a10;
  --logix-diagram-compare: #b49cf2; --logix-diagram-compare-fill: #2a2143;
  --logix-diagram-mux: #f08bc4; --logix-diagram-mux-fill: #3d1a30;
  --logix-diagram-gate: #aebccb; --logix-diagram-gate-fill: #222e3a;
  --logix-diagram-memory: #6dd39b; --logix-diagram-memory-fill: #12331f;
  --logix-diagram-module: #5fd0d3; --logix-diagram-module-fill: #11363a;
  --logix-diagram-fpga: #f39a62; --logix-diagram-fpga-fill: #3d2010;
  --logix-diagram-pin-fill: #1d2731; --logix-diagram-fixed: #8d9aa7;
  --logix-diagram-clock: #7fb0f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px var(--font-ui); display: flex; flex-direction: column; }
/* One toolbar, as the waveform page's: the module's path, Go to source, the
   zoom group, then Export and help at the right. */
.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); }
.bar .right { display: flex; align-items: center; gap: 8px 10px; margin-left: auto; }
.btns { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 2px; }
.btns button { border: 0; background: none; height: 26px; min-width: 28px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.btns button:hover { background: var(--surface); }
.btns button svg { width: 15px; height: 15px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.icon-btn { width: 30px; padding: 0; justify-content: center; }
.ctx { position: fixed; z-index: 70; min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.2); padding: 5px; display: flex; flex-direction: column; font-size: 13px; }
.ctx .it { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--ink); }
.ctx .it:hover, .ctx .it:focus { background: var(--accent-soft); outline: none; border: 0; }
.ctx .it:disabled { opacity: .4; cursor: default; background: none; }
.ctx .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.help { position: fixed; z-index: 60; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.18); padding: 12px; }
.help h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; align-items: start; }
.keys kbd { font-family: var(--font-mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; justify-self: start; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 13px; }
.crumbs { font: 500 13px var(--font-mono); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { color: var(--muted); }
button { font: 13px var(--font-ui); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[hidden] { display: none; }
.canvas { flex: 1; min-height: 0; margin: 0 max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border: 1px solid var(--line); border-radius: 10px; background: var(--logix-diagram-sheet); position: relative; touch-action: none; overflow: hidden; }
.canvas.dragging { cursor: grabbing; }
.canvas > svg { width: 100%; height: 100%; display: block; }
.canvas svg [data-block] { cursor: default; }
.canvas svg .cat-module, .canvas svg .cat-module * { cursor: pointer; }
.canvas svg .block * { pointer-events: all; }
.canvas svg .portbox { pointer-events: all; }
.canvas svg .hit { stroke: transparent; stroke-width: 10; pointer-events: stroke; }
/* Highlights win over the SVG's own colors (its style comes later). */
.canvas svg .hl > .body { stroke: var(--hover) !important; stroke-width: 2.2 !important; }
.canvas svg .portbox.hl { fill: var(--hover) !important; stroke: var(--hover) !important; }
.canvas svg .netHl { stroke: var(--hover) !important; stroke-width: 2.5 !important; }
.canvas svg .junction.netHl { fill: var(--hover) !important; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; background: var(--logix-diagram-sheet); padding: 2px 6px; border-radius: 4px; }
.note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; line-height: 1.5; }
.pop { position: fixed; z-index: 20; max-width: 320px; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / .18); padding: 10px 12px; }
.pop h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
.pop ol { margin: 0; padding-left: 20px; font-size: 13px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.pop .hint2 { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.title { font-size: 15px; font-weight: 500; margin: 0 0 2px; overflow-wrap: anywhere; }
.sub { font: 12px var(--font-mono); color: var(--muted); margin: 0 0 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="bar">
  <nav class="crumbs" id="crumbs" aria-label="Module"></nav>
  <button class="btn" id="source" hidden>Go to source</button>
  <div class="btns" role="group" aria-label="Zoom">
    <button id="zoomOut" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
    <button id="fit" title="Show the whole module (F)">Fit</button>
  </div>
  <div class="right">
    <button class="btn" id="exportBtn" title="Copy or save the diagram, to share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg><span>Export</span>
    </button>
    <button class="btn icon-btn" id="helpBtn" aria-label="Keyboard and mouse" title="Keyboard and mouse">?</button>
  </div>
</header>
<main class="canvas" id="canvas" aria-label="Diagram"></main>
<div class="pop" id="pop" hidden></div>
<script>
(function () {
  "use strict";
  const DATA = /*__DATA__*/null;
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas"), pop = $("pop");
  // The page's host: window.logixHost (the page contract, version 1) in a
  // host's own window, such as Logix IDE's or Logix Viewer's; messages to
  // the parent in an iframe; nothing in a plain browser.
  const host = () => (window.logixHost && window.logixHost.version >= 1 ? window.logixHost : null);
  const inFrame = window.parent !== window;
  const hosted = !!host() || inFrame;
  let path = [];
  let vb = null, home = null;

  // Theme: ?theme=, a host's message, else the system's.
  const root = document.documentElement;
  function setTheme(t) {
    if (t === "light" || t === "dark") root.dataset.theme = t; else delete root.dataset.theme;
  }
  setTheme(new URLSearchParams(location.search).get("theme"));
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  const syncSystem = () => root.classList.toggle("system-dark", media.matches);
  syncSystem();
  media.addEventListener("change", syncSystem);
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "logix-diagram:theme") setTheme(e.data.theme);
  });

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const bitsText = (n) => `${n} bit${n === 1 ? "" : "s"}`;
  const place = (s) => s ? `${s.file}, line ${s.line}` : "";
  const mod = () => DATA.modules[path[path.length - 1] || DATA.top];
  const bitsOf = (el) => (el.dataset.bits || "").split(",").filter(Boolean);
  const signal = (bit) => (mod().signals || {})[bit];

  function post(msg) {
    if (inFrame) window.parent.postMessage(msg, "*");
  }
  function openSource(src) {
    if (!src) return;
    if (host()) host().openSource(src.file, src.line);
    else post({ type: "logix-diagram:open-source", file: src.file, line: src.line });
  }

  function crumbs() {
    const keys = [DATA.top, ...path];
    const el = $("crumbs");
    el.innerHTML = keys.map((k, i) => {
      const name = esc((DATA.modules[k] || {}).name || k);
      return i === keys.length - 1 ? `<b>${name}</b>` : `<a data-depth="${i}">${name}</a>`;
    }).join('<span class="sep">›</span>');
    el.querySelectorAll("a").forEach((a) => {
      a.onclick = () => go(path.slice(0, Number(a.dataset.depth)));
    });
    const src = mod().source;
    $("source").hidden = !(hosted && src);
    $("source").onclick = () => openSource(src);
    $("source").title = src ? place(src) : "";
  }

  function go(next) {
    path = next.filter((k) => DATA.modules[k]);
    try { history.replaceState(null, "", "#" + [DATA.top, ...path].join("/")); } catch (e) { /* a sandboxed frame */ }
    post({ type: "logix-diagram:module", path: [DATA.top, ...path] });
    render();
  }

  function render() {
    hide();
    const m = mod();
    crumbs();
    if (!m.svg) {
      canvas.innerHTML = `<div class="note">${esc(m.note || "This module isn't drawn.")}</div>`;
      return;
    }
    canvas.innerHTML = m.svg + `<div class="hint">Drag to pan · scroll to zoom</div>`;
    const svg = canvas.querySelector("svg");
    const b = svg.getAttribute("viewBox").split(/[\s,]+/).map(Number);
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    const pad = Math.max(b[2], b[3]) * 0.04;
    home = { x: b[0] - pad, y: b[1] - pad, w: b[2] + 2 * pad, h: b[3] + 2 * pad };
    vb = { ...home };
    apply();
    // Wider hover targets for the wires.
    svg.querySelectorAll(".wire").forEach((el) => {
      const hit = el.cloneNode(false);
      hit.setAttribute("class", "hit");
      el.parentNode.insertBefore(hit, el);
    });
  }

  // Pan and zoom by changing the viewBox, so the drawing stays sharp.
  function apply() {
    const svg = canvas.querySelector("svg");
    if (svg && vb) svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  }
  function toSvg(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const s = Math.max(vb.w / r.width, vb.h / r.height);
    const ox = (r.width * s - vb.w) / 2, oy = (r.height * s - vb.h) / 2;
    return { x: vb.x - ox + (cx - r.left) * s, y: vb.y - oy + (cy - r.top) * s, s };
  }
  function zoomAt(factor, cx, cy) {
    if (!vb) return;
    const p = toSvg(cx, cy);
    const nw = Math.min(home.w * 4, Math.max(home.w / 60, vb.w * factor));
    const f = nw / vb.w;
    vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f };
    apply();
  }
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });
  let drag = null;
  // Only the primary button pans, and a pan always ends: a right-click's
  // menu takes the button's release, so without this the page kept panning
  // after the menu closed (the user's report, 2026-11-21).
  const endDrag = () => { drag = null; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerdown", (e) => {
    if (!vb || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", endDrag);
  canvas.addEventListener("contextmenu", endDrag);
  canvas.addEventListener("pointermove", (e) => {
    if (drag && e.buttons === 0) endDrag();
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; canvas.classList.add("dragging"); hide(); }
      if (drag.moved) {
        const s = toSvg(0, 0).s;
        vb = { ...drag.vb, x: drag.vb.x - dx * s, y: drag.vb.y - dy * s };
        apply();
        return;
      }
    }
    hover(document.elementFromPoint(e.clientX, e.clientY), e.clientX, e.clientY);
  });
  canvas.addEventListener("pointerleave", hide);
  canvas.addEventListener("pointerup", (e) => {
    if (e.button !== 0) return;
    const wasDrag = drag && drag.moved;
    endDrag();
    if (!wasDrag) click(e.clientX, e.clientY);
  });
  const center = () => { const r = canvas.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  $("zoomIn").onclick = () => zoomAt(0.7, ...center());
  $("zoomOut").onclick = () => zoomAt(1 / 0.7, ...center());
  const fit = () => { if (home) { vb = { ...home }; apply(); } };
  $("fit").onclick = fit;

  // Keys, as on the waveform page.
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "Escape") { closeMenus(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "+" || e.key === "=") zoomAt(0.7, ...center());
    else if (e.key === "-" || e.key === "_") zoomAt(1 / 0.7, ...center());
    else if (e.key === "f" || e.key === "F") fit();
    else return;
    e.preventDefault();
  });

  // Export: the shown part of the module as a picture, to share, as the
  // waveform page's Export (the user's request, 2026-11-22). Saving goes
  // through the host (window.logixHost, Logix Viewer); in a plain browser
  // it downloads; a host with neither can only copy.
  const canSave = () => !!(host() && host().saveAs) || !hosted;
  function toast(text) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
  }
  // The picture as plain SVG, the way the waveform page writes it, so any
  // app shows it as the page does: each shape's colors, line and font as
  // attributes, from the page's computed style (no stylesheet, no CSS
  // variables, which Inkscape and older librsvg drop: a blank picture), a
  // background over the whole picture, and whole-pixel sizes (macOS
  // Preview framed the fractional ones). The user's tests, 2026-11-23.
  const PAINT = ["fill", "stroke", "stroke-width", "stroke-linecap", "stroke-dasharray", "opacity",
    "font-family", "font-size", "font-weight", "font-style", "text-anchor", "dominant-baseline"];
  function background(el) {
    for (let e = el; e; e = e.parentElement) {
      const c = getComputedStyle(e).backgroundColor;
      if (c && c !== "transparent" && !/rgba\(.*,\s*0\)$/.test(c)) return c;
    }
    return "#ffffff";
  }
  function shownSvg() {
    const svg = canvas.querySelector("svg");
    if (!svg || !vb) return null;
    // No highlight in the picture: only what the diagram shows.
    const lit = [...svg.querySelectorAll(".hl, .netHl")].map((e) => [e, e.getAttribute("class")]);
    lit.forEach(([e]) => e.classList.remove("hl", "netHl"));
    const copy = svg.cloneNode(true);
    const live = [svg, ...svg.querySelectorAll("*")], copied = [copy, ...copy.querySelectorAll("*")];
    live.forEach((el, k) => {
      const c = copied[k];
      if (!c || el.tagName === "style") return;
      const cs = getComputedStyle(el);
      for (const p of PAINT) { const v = cs.getPropertyValue(p); if (v) c.setAttribute(p, v); }
      c.removeAttribute("style");
    });
    lit.forEach(([e, c]) => e.setAttribute("class", c));
    copy.querySelectorAll("style, .hit").forEach((e) => e.remove());
    copy.removeAttribute("class");
    // As big as it shows on screen, never smaller than its own units: at
    // its units' size, apps showed it small (text 10 pixels high; the
    // user's report, 2026-11-23).
    const k = Math.max(1, Math.min(svg.clientWidth / vb.w, svg.clientHeight / vb.h) || 1);
    const w = Math.ceil(vb.w * k), h = Math.ceil(vb.h * k);
    copy.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    copy.setAttribute("viewBox", `${vb.x} ${vb.y} ${w / k} ${h / k}`);
    copy.setAttribute("width", w); copy.setAttribute("height", h);
    copy.removeAttribute("preserveAspectRatio");
    const sheet = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    sheet.setAttribute("x", vb.x); sheet.setAttribute("y", vb.y); sheet.setAttribute("width", w / k); sheet.setAttribute("height", h / k);
    sheet.setAttribute("fill", background(canvas)); sheet.setAttribute("stroke", "none");
    copy.insertBefore(sheet, copy.firstChild);
    return { text: new XMLSerializer().serializeToString(copy), w, h };
  }
  function pngCanvas(done) {
    const s = shownSvg(); if (!s) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = s.w * 2; c.height = s.h * 2;
      const g = c.getContext("2d"); g.scale(2, 2); g.drawImage(img, 0, 0); done(c);
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.text);
  }
  const baseName = () => "diagram-" + [DATA.top, ...path].map((k) => (DATA.modules[k] || {}).name || k).join("-");
  function save(name, mime, data) {
    if (host() && host().saveAs) { host().saveAs(name, mime, data); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast(`Downloaded ${name}.`);
  }
  function copyImage() {
    const failed = () => toast("Couldn't copy the image here.");
    try {
      const png = new Promise((resolve) => pngCanvas((c) => c.toBlob(resolve, "image/png")));
      navigator.clipboard.write([new ClipboardItem({ "image/png": png })])
        .then(() => toast("Copied a picture of the diagram: paste it into a message or a document."), failed);
    } catch (e) { failed(); }
  }
  function saveImage(kind) {
    const name = baseName() + "." + kind;
    if (kind === "svg") { const s = shownSvg(); if (s) save(name, "image/svg+xml", s.text); return; }
    pngCanvas((c) => {
      if (host() && host().saveAs) save(name, "image/png", c.toDataURL("image/png").split(",")[1]);
      else c.toBlob((b) => save(name, "image/png", b), "image/png");
    });
  }
  let menu = null, help = null;
  function closeMenus() {
    if (menu) { menu.remove(); menu = null; }
    if (help) { help.remove(); help = null; }
  }
  function placeAt(el, anchor) {
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect();
    el.style.left = Math.max(8, Math.min(r.right - el.offsetWidth, window.innerWidth - el.offsetWidth - 8)) + "px";
    el.style.top = (r.bottom + 4) + "px";
  }
  $("exportBtn").addEventListener("click", (e) => {
    if (menu) { closeMenus(); return; }
    closeMenus();
    const items = [
      { label: "Copy shown image", act: copyImage },
      "-",
      { label: "Save shown image (PNG)…", act: () => saveImage("png"), disabled: !canSave() },
      { label: "Save shown image (SVG)…", act: () => saveImage("svg"), disabled: !canSave() },
    ];
    menu = document.createElement("div"); menu.className = "ctx"; menu.setAttribute("role", "menu");
    for (const it of items) {
      if (it === "-") { menu.insertAdjacentHTML("beforeend", '<div class="sep"></div>'); continue; }
      const b = document.createElement("button"); b.className = "it"; b.setAttribute("role", "menuitem");
      b.textContent = it.label; b.disabled = !!it.disabled;
      b.onclick = () => { closeMenus(); it.act(); };
      menu.appendChild(b);
    }
    placeAt(menu, e.currentTarget);
  });
  $("helpBtn").addEventListener("click", (e) => {
    if (help) { closeMenus(); return; }
    closeMenus();
    help = document.createElement("div"); help.className = "help"; help.setAttribute("role", "dialog"); help.setAttribute("aria-label", "Keyboard and mouse");
    const rows = [
      ["Hover", "A block, port, wire, pin or label's details"], ["Double-click a module", "Open its diagram"],
      ["The path at the top left", "Back to a module above"], ["Drag", "Move around"], ["Wheel or pinch", "Zoom around the pointer"],
      ["+  −", "Zoom in, out"], ["F", "Show the whole module"],
    ].concat(hosted ? [["Double-click a block", "Go to its source line"]] : []);
    help.innerHTML = `<h3>Keyboard and mouse</h3><div class="keys">${rows.map(([k, t]) => `<kbd>${esc(k)}</kbd><span>${esc(t)}</span>`).join("")}</div>`;
    placeAt(help, e.currentTarget);
  });
  document.addEventListener("pointerdown", (e) => {
    if ((menu && !menu.contains(e.target) && !e.target.closest("#exportBtn")) || (help && !help.contains(e.target) && !e.target.closest("#helpBtn"))) closeMenus();
  }, true);
  window.addEventListener("blur", closeMenus);

  let lit = [];
  function light(el, cls) { el.classList.add(cls); lit.push([el, cls]); }
  function clearLit() { lit.forEach(([el, cls]) => el.classList.remove(cls)); lit = []; }
  function hide() { clearLit(); pop.hidden = true; }
  function show(html, cx, cy) {
    pop.innerHTML = html;
    pop.hidden = false;
    const r = pop.getBoundingClientRect();
    let x = cx + 16, y = cy + 16;
    if (x + r.width > window.innerWidth - 8) x = cx - r.width - 16;
    if (y + r.height > window.innerHeight - 8) y = cy - r.height - 16;
    pop.style.left = Math.max(8, x) + "px";
    pop.style.top = Math.max(8, y) + "px";
  }
  // Signals drawn as labels: hovering one piece lights up all of them.
  function labeledNames() {
    return new Set(Object.values(mod().labels || {}).filter((l) => l.kind === "signal").map((l) => l.text));
  }
  function lightWires(test) {
    canvas.querySelectorAll(".wire, .junction").forEach((el) => { if (test(bitsOf(el))) light(el, "netHl"); });
  }
  function blockBox(block, port) {
    return canvas.querySelector(`.portbox[data-block="${CSS.escape(block)}"][data-port="${CSS.escape(port)}"]`);
  }
  function partText(part) {
    const m = /^\[(\d+)(?::(\d+))?\]$/.exec(part);
    if (!m || m[2] == null) return `bit ${part}`;
    return `bits ${part} (${Number(m[1]) - Number(m[2]) + 1} bits)`;
  }
  function busName(sj) {
    const g = canvas.querySelector(`g[data-sj="${CSS.escape(sj)}"]`);
    const bits = g ? bitsOf(g) : [];
    const s = signal(bits[0]);
    return { name: s && s.name ? s.name : "bus", n: bits.length, kind: g ? g.dataset.kind : "split", g };
  }

  function hover(t, cx, cy) {
    clearLit();
    if (!t || !canvas.contains(t) || !vb) { pop.hidden = true; return; }
    const m = mod();
    // A split's or join's port: what it extracts or contributes.
    if (t.classList.contains("portbox") && t.dataset.sj) {
      light(t, "hl");
      const { name, n, kind } = busName(t.dataset.sj);
      const combined = (kind === "split") === (t.dataset.side === "in");
      if (combined) {
        show(`<p class="title">${esc(name)}[${n - 1}:0]</p><p class="sub">the combined value, ${n} bits: ${kind === "split" ? "input" : "output"} of a bus ${kind}</p>`, cx, cy);
      } else {
        const verb = kind === "split" ? "Extracts" : "Contributes";
        show(`<p class="title">${verb} ${esc(partText(t.dataset.part))}</p><p class="sub">${kind === "split" ? "an output" : "an input"} of a bus ${kind}, ${kind === "split" ? "from" : "to"} the combined value ${esc(name)}[${n - 1}:0]</p>`, cx, cy);
      }
      return;
    }
    // A block's port.
    if (t.classList.contains("portbox") && t.dataset.block) {
      light(t, "hl");
      const info = (m.blocks || {})[t.dataset.block] || {};
      const p = (info.ports || {})[t.dataset.port] || {};
      const fixed = (info.fixed || {})[t.dataset.port];
      let html = `<p class="title">${esc(t.dataset.port)}</p><p class="sub">${esc(p.direction || "port")}${p.width ? ", " + bitsText(p.width) : ""} of ${esc(info.name || info.title || "")}</p><dl class="kv">`;
      if (fixed === "don't care") html += `<dt>Value</dt><dd>don't care: not connected, any value will do</dd>`;
      else if (fixed != null) html += `<dt>Fixed to</dt><dd>${esc(fixed)}</dd>`;
      else html += `<dt>Signal</dt><dd>${esc(p.signal || "unnamed")}</dd>`;
      show(html + "</dl>", cx, cy);
      return;
    }
    const lbl = t.closest("[data-label]");
    if (lbl) {
      const l = (m.labels || {})[lbl.dataset.label] || {};
      if (l.kind === "signal") { const names = labeledNames(); lightWires((bits) => { const s = signal(bits[0]); return s && s.name === l.text && names.has(l.text); }); }
      let sub = l.text === "don't care" ? "not connected: any value will do"
        : l.kind === "fixed" ? "a fixed value" : "a signal, drawn as a label";
      if (l.block && l.direction === "in") {
        const box = blockBox(l.block, l.port);
        if (box) light(box, "hl");
        const info = (m.blocks || {})[l.block] || {};
        sub += `, into ${esc(l.port)} of ${esc(info.name || info.title || "")}`;
      }
      show(`<p class="title">${esc(l.text)}</p><p class="sub">${sub}</p>`, cx, cy);
      return;
    }
    const pin = t.closest("[data-pin]");
    if (pin) {
      const name = pin.dataset.pin;
      const p = (m.pins || {})[name] || { direction: "", width: 0, bits: [] };
      light(pin, "hl");
      const bits = new Set((p.bits || []).map(String));
      const named = labeledNames().has(name);
      lightWires((b) => b.some((x) => bits.has(x)) || (named && signal(b[0]) && signal(b[0]).name === name));
      const text = !m.top ? "A port of this module."
        : p.width > 1 ? `${p.width} pins of the FPGA, one per bit: the pin file connects each to the board.`
        : "A pin of the FPGA: the pin file connects it to the board.";
      show(`<p class="title">${esc(name)}</p><p class="sub">${esc(p.direction)}${p.width ? ", " + bitsText(p.width) : ""}</p><p class="hint2">${text}</p>`, cx, cy);
      return;
    }
    const sjg = t.closest("g[data-sj]");
    if (sjg) {
      light(sjg, "hl");
      const { name, n, kind } = busName(sjg.dataset.sj);
      const side = kind === "split" ? "out" : "in";
      const verb = kind === "split" ? "extracts" : "contributes";
      const parts = [...canvas.querySelectorAll(`.portbox[data-sj="${CSS.escape(sjg.dataset.sj)}"]`)]
        .filter((x) => x.dataset.side === side)
        .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
      show(`<p class="title">Bus ${kind}</p><dl class="kv"><dt>Combined value</dt><dd>${esc(name)}[${n - 1}:0], ${n} bits (the ${kind === "split" ? "input" : "output"})</dd></dl>` +
        `<h2>${kind === "split" ? "Outputs" : "Inputs"}, top to bottom</h2><ol>${parts.map((x) => `<li>${verb} ${esc(partText(x.dataset.part))}</li>`).join("")}</ol>`, cx, cy);
      return;
    }
    const k = t.closest("[data-const]");
    if (k) {
      light(k, "hl");
      show(`<p class="title">${esc(k.dataset.const)}</p><p class="sub">a fixed value</p>`, cx, cy);
      return;
    }
    const blk = t.closest("g[data-block]");
    if (blk) {
      light(blk, "hl");
      // A memory's ports: all of them.
      if (blk.dataset.memory) {
        canvas.querySelectorAll(`g[data-memory="${CSS.escape(blk.dataset.memory)}"]`).forEach((g) => { if (g !== blk) light(g, "hl"); });
      }
      const info = (m.blocks || {})[blk.dataset.block];
      if (info) show(blockHtml(info), cx, cy); else pop.hidden = true;
      return;
    }
    if (t.classList.contains("hit") || t.classList.contains("wire") || t.classList.contains("junction")) {
      const bits = bitsOf(t);
      const s = signal(bits[0]);
      const names = labeledNames();
      const own = t.dataset.bits;
      const shared = s && s.name && names.has(s.name) ? s.name : null;
      lightWires((b) => b.join(",") === own || (shared && signal(b[0]) && signal(b[0]).name === shared));
      show(s && s.name
        ? `<p class="title">${esc(s.name)}</p><p class="sub">signal, ${bitsText(bits.length)}</p>`
        : `<p class="title">Unnamed signal</p><p class="sub">${bitsText(bits.length)}, made by synthesis</p>`, cx, cy);
      return;
    }
    pop.hidden = true;
  }

  function blockHtml(info) {
    const sub = info.kind === "module" ? `instance ${info.instance || ""}`
      : info.kind === "fpga" ? info.type
      : info.type + (info.width ? `, ${bitsText(info.width)}` : "");
    let html = info.name
      ? `<p class="title">${esc(info.name)}</p><p class="sub">${esc(info.title)}, ${esc(sub)}</p>`
      : `<p class="title">${esc(info.title)}</p><p class="sub">${esc(sub)}</p>`;
    html += `<dl class="kv"><dt>Kind</dt><dd>${{ logic: "Logic", module: "Module", fpga: "FPGA block" }[info.kind] || ""}</dd>`;
    if (info.source) html += `<dt>Source</dt><dd>${esc(place(info.source))}</dd>`;
    if (info.memory) html += `<dt>Memory</dt><dd>${esc(info.memory)}</dd>`;
    if (info.memory_init) html += `<dt>Contents</dt><dd>initial values loaded in ${esc(place(info.memory_init))}</dd>`;
    html += "</dl>";
    const fixed = Object.entries(info.fixed || {});
    if (fixed.length) html += `<h2>Fixed inputs</h2><dl class="kv">${fixed.map(([p, v]) => `<dt>${esc(p)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
    if (info.kind === "module") html += `<p class="hint2">Double-click to open it.</p>`;
    else if (hosted && info.source) html += `<p class="hint2">Double-click to go to its source.</p>`;
    return html;
  }

  /** The block at a point, with its model entry. */
  function blockAt(cx, cy) {
    const el = document.elementFromPoint(cx, cy);
    if (!el || !canvas.contains(el)) return null;
    const blk = el.closest("[data-block]");
    return blk ? (mod().blocks || {})[blk.dataset.block] || null : null;
  }

  // Opening a module, or going to a block's source, takes a double-click,
  // so a stray click while exploring changes nothing.
  function click() {}
  canvas.addEventListener("dblclick", (e) => {
    const info = blockAt(e.clientX, e.clientY);
    if (!info) return;
    if (info.kind === "module" && DATA.modules[info.module]) go([...path, info.module]);
    else if (info.kind !== "module" && hosted) openSource(info.source);
  });

  // Open the module the address names, such as #main/notegen.
  const start = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
  if (start[0] === DATA.top) start.shift();
  path = start.filter((k) => DATA.modules[k]);
  render();
})();
</script>
</body>
</html>
