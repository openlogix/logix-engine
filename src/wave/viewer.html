<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logix Waveforms</title>
<!-- Written by Logix Engine's simulate tool (docs/tool-api.md, "The
     waveform viewer"). Self-contained: it needs no network and nothing
     installed. Hosts can embed it in an iframe or a window of their own:
     ?theme=light|dark sets the theme, and it accepts
     {type: "logix-wave:theme", theme}. It posts
     {type: "logix-wave:open-source", file, line} when a signal's name or a
     failure is double-clicked or clicked, and {type: "logix-wave:view", view}
     with the view (the .view file's JSON) after every change, so a host saves
     it. A host that loads it directly can define
     window.logixWaveOpenSource(file, line) and window.logixWaveSaveView(view)
     instead. Save as image posts {type: "logix-wave:save-file", name, mime,
     data} (SVG text, or PNG as base64), or calls window.logixWaveSaveFile. With no host, as in a browser, the view isn't saved: there's no Save view button (the user's decision, 2026-11-21, until a clear use for one). -->
<style>
/* Layout: a one-screen tool. Header bar; signal browser on the left; the viewer on the right as three aligned columns (name, value at cursor, waves) under one time ruler. */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --fg: #15201e; --muted: #5c6b68; --line: #dde4e2; --soft: #edf2f0;
  --accent: #00838a; --accent-soft: #d8efee; --wave-bg: #ffffff; --grid: #eef2f1; --sel: #f1f7f6; --group-bg: #e4e8e8; --group-fg: #36433f;
  --x: #d23b3b; --z: #b88400; --fail: #d23b3b; --marker: #7a52d6;
  --s1: #0f8a66; --s2: #2463c7; --s3: #b25b06; --s4: #8a3fd0; --s5: #c23478; --s6: #0d7891;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --row-h: 30px; --name-w: 210px; --val-w: 92px; --radius: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1110; --panel: #121918; --fg: #e2ebe9; --muted: #8b9d99; --line: #22302d; --soft: #19221f;
  --accent: #3cc8c0; --accent-soft: #143331; --wave-bg: #0f1615; --grid: #182220; --sel: #15201e; --group-bg: #232d2b; --group-fg: #c6d2cf;
  --x: #f47272; --z: #f2b52a; --fail: #f47272; --marker: #b493ff;
  --s1: #3ad69c; --s2: #72a9ff; --s3: #f5a43a; --s4: #bd92ff; --s5: #f477b5; --s6: #2fd0ea;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1110; --panel: #121918; --fg: #e2ebe9; --muted: #8b9d99; --line: #22302d; --soft: #19221f;
  --accent: #3cc8c0; --accent-soft: #143331; --wave-bg: #0f1615; --grid: #182220; --sel: #15201e; --group-bg: #232d2b; --group-fg: #c6d2cf;
  --x: #f47272; --z: #f2b52a; --fail: #f47272; --marker: #b493ff;
  --s1: #3ad69c; --s2: #72a9ff; --s3: #f5a43a; --s4: #bd92ff; --s5: #f477b5; --s6: #2fd0ea;
  color-scheme: dark; }

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 250px 1fr;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; box-sizing: border-box; }

/* Header */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; }
.top .right { display: flex; align-items: center; gap: 8px 10px; margin-left: auto; }
/* The time base: Time | Cycles, and the clock (R44). */
.btns button.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.clock-pick { gap: 6px; font-family: var(--mono); font-size: 12px; max-width: 220px; }
.clock-pick #clockName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.clock-pick .clk-ico svg { width: 14px; height: 14px; display: block; color: var(--accent); }
.clock-pick .dd { width: 12px; height: 12px; flex: none; color: var(--muted); }
.clock-pick.idle { color: var(--muted); }
.clock-pick.idle .clk-ico svg { color: var(--muted); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
/* One toolbar across the window: the testbench's name is in the window's
   title, so the page has no name or icon of its own (R43). */
.spacer { flex: 1; }
/* hidden always hides, whatever display a class gives (a hidden button
   showed, the user's report, 2026-11-21). */
[hidden] { display: none !important; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.btn svg { width: 15px; height: 15px; }
.icon-btn { width: 30px; padding: 0; justify-content: center; }

/* Browser */
.browser { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.browser h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 12px 8px; font-weight: 600; }
.search { margin: 0 10px 8px; position: relative; }
.search input { width: 100%; box-sizing: border-box; height: 30px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); padding: 0 10px 0 28px; font: inherit; }
.search svg { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--muted); }
.tree { overflow: auto; padding: 0 6px 10px; flex: 1; }
.scope-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: left; }
.scope-h:hover { background: var(--soft); }
.scope-h .chev { width: 10px; transition: transform .15s; color: var(--muted); }
.scope[data-open="false"] > .kids { display: none; }
.scope[data-open="true"] > .scope-h .chev { transform: rotate(90deg); }
.scope-h .kind { font-weight: 400; color: var(--muted); font-size: 11px; }
.kids { padding-left: 12px; }
.var { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: default; text-align: left; font-family: var(--mono); font-size: 12px; }
.var:hover { background: var(--soft); }
.var .chk { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; cursor: pointer; position: relative; }
/* A larger area to click than the box drawn. */
.var .chk::before { content: ""; position: absolute; inset: -6px; }
.var .chk:hover { border-color: var(--accent); }
.var.on .chk { background: var(--accent); border-color: var(--accent); }
.var.on .chk::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--panel); border-top: 0; border-right: 0; transform: translate(0, -1px) rotate(-45deg); }
.var .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.var .w { color: var(--muted); font-size: 11px; }
.browser .hint { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.45; }

/* Viewer */
.viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.btns { display: flex; gap: 2px; background: var(--soft); border-radius: var(--radius); padding: 2px; }
.btns button { border: 0; background: none; height: 26px; min-width: 28px; padding: 0 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--fg); }
.btns button:hover:not(:disabled) { background: var(--panel); }
.btns button:disabled { opacity: .35; cursor: default; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; align-items: start; }
.keys kbd { font-family: var(--mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; justify-self: start; }
/* A group row is a group's title: gray in the Signal column only, as the
   board picker's family headings, and an arrow that folds the group. */
.nrow.group, .nrow.group.sel, .nrow.group:hover { background: var(--group-bg); }
.nrow.group { cursor: pointer; }
.nrow .fold svg { width: 16px; height: 16px; display: block; margin: auto; }
.nrow .fold { border: 0; background: none; color: var(--group-fg); width: 24px; height: 24px; margin-left: -6px; padding: 0; cursor: pointer; font-size: 17px; line-height: 24px; border-radius: 5px; flex: none; }
.nrow .fold:hover { background: var(--soft); color: var(--fg); }
/* A bus's fold arrow shows its bits (R58); the bits sit indented under it. */
.nrow .fold.bits { width: 18px; height: 20px; margin: 0 -4px 0 -8px; color: var(--muted); }
.nrow .fold.bits svg { width: 13px; height: 13px; }
.nrow.bit { padding-left: 30px; }
.nrow.bit .nm { color: var(--muted); }
.nrow .hidden-n { font-weight: 400; font-family: var(--mono); font-size: 11px; }
.nrow.group .nm { font-family: var(--font); font-weight: 600; font-size: 12px; color: var(--group-fg); letter-spacing: .02em; }
.nrow.blank .nm { color: var(--muted); font-size: 11px; opacity: 0; }
.nrow.blank:hover .nm { opacity: .7; }
.pop input[type=text] { width: 100%; box-sizing: border-box; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 0 8px; font: inherit; }
.btns button svg { width: 15px; height: 15px; }
/* Undo and redo, next to the testbench's name where they're easy to find, a size up. */
.btns.undo button { height: 30px; min-width: 34px; }
/* Time or Cycles: one choice of two, shown as one outlined control with the
   chosen half filled (the user's request, 2026-11-22: two plain buttons
   didn't read as a one-of choice). */
.btns.tb { background: var(--panel); border: 1px solid var(--line); padding: 2px; gap: 0; }
.btns.tb button { border-radius: 5px; color: var(--muted); }
.btns.tb button.on, .btns.tb button.on:hover { background: var(--accent); color: #fff; box-shadow: none; }
.btns.undo button svg { width: 19px; height: 19px; }
.fail-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--fail) 45%, transparent); background: color-mix(in srgb, var(--fail) 10%, transparent); color: var(--fail); font-weight: 600; cursor: pointer; }
.fail-chip[hidden] { display: none; }
.failbar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--fail) 9%, var(--panel)); color: var(--fg); font-size: 12.5px; flex-wrap: wrap; }
.failbar[hidden], .truncbar[hidden] { display: none; }
.failbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fail); flex: none; }
.failbar .msg { font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; }
.failbar .src { color: var(--fail); font-family: var(--mono); font-size: 12px; }
.failbar .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.failbar .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.failbar .spacer { flex: 1; }
.truncbar { padding: 7px 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--z) 12%, var(--panel)); font-size: 12.5px; }
.flist { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; }
.flist button { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.flist button:hover, .flist button.on { background: var(--soft); }
.flist .t { font-family: var(--mono); font-size: 11px; color: var(--fail); white-space: nowrap; }
.flist .m { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.flist .s { grid-column: 2; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.fail-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fail); }

.cols { display: grid; grid-template-columns: var(--name-w) var(--val-w) minmax(0, 1fr); }
.head { border-bottom: 1px solid var(--line); height: 30px; }
.head > div { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; align-items: center; padding: 0 10px; border-right: 1px solid var(--line); }
.head canvas, .wavecol canvas { display: block; width: 100%; }
.rows { flex: 1; overflow: auto; min-height: 0; position: relative; }
.names, .vals { border-right: 1px solid var(--line); }
.nrow, .vrow { height: var(--row-h); display: flex; align-items: center; box-sizing: border-box; border-bottom: 1px solid var(--grid); }
.nrow { gap: 8px; padding: 0 4px 0 10px; cursor: pointer; user-select: none; }
/* Rows are selected, not text: Shift+click selects a range of rows (R46). */
.names, .vals { -webkit-user-select: none; user-select: none; }
/* Hover is a faint gray, unlike the selection's tint, so it can't pass for
   a selected row (the user's report, 2026-11-21). After a drop it waits for
   the mouse to move: the browser keeps the hover where the drag began. */
.nrow.sel, .vrow.sel { background: var(--sel); }
.names:not(.after-drop) .nrow:not(.sel):not(.group):hover { background: color-mix(in srgb, var(--fg) 7%, var(--panel)); }
.nrow.sel { box-shadow: inset 2px 0 0 var(--c); }
.nrow.drop { box-shadow: inset 0 2px 0 var(--accent); }
.nrow.drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
.nrow .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--c); flex: none; }
.clk-badge { display: inline-flex; vertical-align: -2px; margin-left: 6px; color: var(--accent); }
.clk-badge svg { width: 13px; height: 13px; }
.clk-badge.idle { color: var(--muted); opacity: .75; }
.nrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.nrow .sc { color: var(--muted); }
.nrow .rg { color: var(--muted); font-size: 11px; }
/* Values end 12 px from the column's right border, as its title does, so
   digits line up (tabular numbers). */
.vrow { padding: 0 12px 0 8px; text-align: right; text-overflow: ellipsis; display: block; line-height: calc(var(--row-h) - 1px); font-family: var(--mono); font-size: 12px; color: var(--c); font-weight: 500; font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap; }
/* A value too long for the column is cut on its left, keeping its low
   digits, the ones that change (the user's request, 2026-11-21): the cell
   runs right to left, the value itself left to right. */
.vrow { direction: rtl; white-space: nowrap; }
.vrow.xv { color: var(--x); }
.wavecol { position: relative; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.empty[hidden] { display: none; }

.status { display: flex; gap: 4px 16px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.status b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
.status .cur b { color: var(--accent); }
.status .mk b { color: var(--marker); }
.status .help { margin-left: auto; }
/* On a line of their own (a narrow window), the hints start at the left, as the line above. */
.status.wrapped .help { margin-left: 0; }
.app.no-hints .status .help, .app.no-hints .browser > .hint { display: none; }

/* A short message after an action that shows nothing by itself, such as a
   download. */
.toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 80; max-width: min(520px, calc(100% - 32px)); background: var(--fg); color: var(--panel); border-radius: 8px; padding: 9px 14px; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--panel); border-radius: 7px; padding: 6px 9px; font-size: 12px; line-height: 1.4; z-index: 30; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.tip .how { margin-top: 3px; opacity: .7; font-size: 11.5px; }
.tip code { font-family: var(--mono); }
.tip .t { opacity: .7; font-family: var(--mono); font-size: 11px; }
.tip code { font-family: var(--mono); }

/* Popovers and dialog */
/* The viewer's own right-click menu. */
.ctx { position: fixed; z-index: 70; min-width: 230px; max-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.2); padding: 5px; display: flex; flex-direction: column; font-size: 13px; }
.ctx .ttl { padding: 6px 10px 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx .it { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--fg); }
.ctx .it:hover, .ctx .it:focus { background: var(--accent-soft); outline: none; }
.ctx .it:disabled { opacity: .4; cursor: default; background: none; }
.ctx .it .k { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.ctx .it.danger { color: var(--x); }
/* A menu item that's on or off, drawn as a checkbox (the user's request, 2026-11-22). */
.ctx .it.chk { gap: 9px; }
.ctx .it .box { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: center; }
.ctx .it[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.ctx .it .box svg { width: 10px; height: 10px; visibility: hidden; }
.ctx .it[aria-checked="true"] .box svg { visibility: visible; }
.ctx .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.ctx .sub { padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 5px; }
.ctx .sub .lbl { font-size: 11px; color: var(--muted); }
.ctx .seg button { font-size: 11.5px; }
.pop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.18); padding: 12px; width: 250px; display: flex; flex-direction: column; gap: 12px; }
.pop h3 { margin: 0; font-size: 12px; font-family: var(--mono); font-weight: 600; overflow-wrap: anywhere; }
.pop .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--soft); padding: 2px; border-radius: 8px; }
.seg button { flex: 1; border: 0; background: none; height: 26px; padding: 0 6px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.seg button.on { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.swatches { display: flex; gap: 8px; }
.swatches button { width: 22px; height: 22px; border-radius: 6px; border: 0; cursor: pointer; background: var(--c); }
.swatches button.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--c); }
.pop .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pop .actions .btn { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger { color: var(--x); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); }

.overlay { position: fixed; inset: 0; background: rgba(5, 12, 11, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay[hidden] { display: none; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.dialog h2 { margin: 0; font-size: 16px; }
.dialog p { margin: 0; color: var(--muted); line-height: 1.5; }
.dialog pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.drop-hint { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none; }
.drop-hint[hidden] { display: none; }

/* More room for the waves: the signal list hides, and the Signal and Value
   columns are resized by dragging their right border. */
.app.no-browser { grid-template-columns: 1fr; }
.app.no-browser .browser { display: none; }
.side-btn.on { border-color: var(--accent); color: var(--accent); }
.head > div { position: relative; overflow: hidden; white-space: nowrap; }
#valHead { padding: 0 8px 0 4px; }
/* The title gives way first: at any width the chevron stays. */
#valHead .vt { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.app.val-narrow #valHead .vt { display: none; }

// A spreadsheet (R48), of all (every signal in the file over the whole run,
// in the testbench's order, each in its usual format) or of what's shown
// (the rows' signals and order over the range on screen); a row at
// each change of any of them, or, counting cycles, at each rising edge of
// the clock (the values a logic analyzer shows). Values are numbers (cell).
const MAX_CSV_ROWS = 200000;
function exportCSV(all) {
  let rows = S.rows.filter((r) => r.v);
  if (all) {
    const vars = S.wave.vars.filter((v) => v.type !== 'parameter'), first = inOrder(vars.filter((v) => v.path.split('.').length === 2));
    rows = [...first, ...vars.filter((v) => !first.includes(v)).sort((a, b) => a.path.localeCompare(b.path))].map(sigRow);
  }
  if (!rows.length) { toast('No signals are shown: nothing to export.'); return; }
  const from = all ? 0 : S.start, to = all ? S.wave.end : S.end;
  let times;
  if (counting()) times = S.edges.filter((t) => t >= from && t <= to);
  else {
    const set = new Set([Math.max(0, Math.round(from))]);
    for (const r of rows) { const d = S.wave.data.get(r.v.id); for (let k = Math.max(0, idx(d.t, from)); k < d.t.length && d.t[k] <= to; k++) if (d.t[k] >= from) set.add(d.t[k]); }
    times = [...set].sort((a, b) => a - b);
  }
  const cut = times.length > MAX_CSV_ROWS; if (cut) times = times.slice(0, MAX_CSV_ROWS);
  const [unit, f] = unitFor();
  const q = (x) => /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
  const name = (v) => v.path.split('.').slice(1).join('.') + (v.range && !v.name.includes('[') ? v.range : '');
  // Numbers a spreadsheet can calculate and chart with (the user's
  // decision, 2026-11-21): decimal, signed for signed signals (integers, or
  // a row shown as Signed); unknown values (x, z) empty, which formulas and
  // charts skip; buses over 48 bits as hex text with 0x, since spreadsheets
  // keep only about 15 digits exactly.
  let wide = false;
  const cell = (r, t) => {
    const val = valueAt(r.v, t), w = r.v.width;
    if (val == null || isX(val) || /[xz]/.test(val)) return '';
    if (val[0] === 'r') return fmt(val, w, 'dec');
    if (w === 1) return fmt(val, w, 'bin');
    if (w > 48) { wide = true; return '0x' + fmt(val, w, 'hex'); }
    return fmt(val, w, r.radix === 'signed' || r.v.type === 'integer' ? 'signed' : 'dec');
  };
  const lines = [[...(counting() ? ['cycle'] : []), `time (${unit})`, ...rows.map((r) => name(r.v))].map(q).join(',')];
  for (const t of times) {
    const time = +(t * S.wave.ts / f).toFixed(6);
    lines.push([...(counting() ? [Math.round(cyclePos(t))] : []), time, ...rows.map((r) => q(cell(r, t)))].join(','));
  }
  // The file's name says which: uart_tb-all.csv, uart_tb-shown.csv.
  const base = S.file.replace(/\.vcd$/i, '') + (all ? '-all' : '-shown');
  saveFile(base + '.csv', 'text/csv', lines.join('\n') + '\n');
  const what = all ? `all ${rows.length} signals, the whole run` : `${rows.length} shown signals, ${fmtAt(from)} to ${fmtAt(to)}`;
  toast(`${hosted ? 'Exported' : 'Downloaded'} ${base}.csv: ${what}, ${times.length.toLocaleString('en-US')} rows, as numbers${wide ? ' (buses over 48 bits as 0x hex text)' : ''}${cut ? ` (only the first ${MAX_CSV_ROWS.toLocaleString('en-US')}: export what's shown, zoomed in, for the rest)` : ''}.`);
}

// The view as a web page to share (R48): this page, with the view built in
// (rows, groups, formats, zoom, cursor, marker, time base), and all the
// waveform's signals, for someone to look into, or only the shown ones
// (and the clock), small and holding what was meant. Anyone opens it in a
// browser; their changes stay in their copy.
function exportPage(all) {
  if (!PAGE) return;
  const base = S.file.replace(/\.vcd$/i, '') + (all ? '-all' : '-shown');
  const save = (data) => {
    const json = JSON.stringify(data).replace(/<\//g, '<\\/');
    saveFile(base + '.html', 'text/html', PAGE.head + json + ';' + PAGE.tail);
    toast(`${hosted ? 'Exported' : 'Downloaded'} ${base}.html: open it in any web browser.`);
  };
  if (all) { save({ ...DATA, view: viewData(), focus: null }); return; }
  const keep = new Set(S.rows.filter((r) => r.v).map((r) => r.v.path)); if (S.clock) keep.add(S.clock);
  const vars = S.wave.vars.filter((v) => keep.has(v.path));
  const ids = new Set(vars.map((v) => v.id));
  // A VCD of those signals, written from the parsed waveform.
  const tsm = /\$timescale\s+([\s\S]*?)\$end/.exec(DATA.vcd || '');
  const out = [`$timescale ${tsm ? tsm[1].trim() : '1ns'} $end`];
  const has = (n) => n.vars.some((v) => keep.has(v.path)) || n.children.some(has);
  const scope = (n) => {
    if (!has(n)) return;
    out.push(`$scope ${n.kind || 'module'} ${n.name} $end`);
    for (const v of n.vars) if (keep.has(v.path)) out.push(`$var ${v.type} ${v.width} ${v.id} ${v.name}${v.range && !v.name.includes('[') ? ' ' + v.range : ''} $end`);
    n.children.forEach(scope); out.push('$upscope $end');
  };
  S.wave.root.children.forEach(scope);
  out.push('$enddefinitions $end');
  const ev = [];
  for (const id of ids) {
    const d = S.wave.data.get(id), v = vars.find((x) => x.id === id);
    for (let k = 0; k < d.t.length; k++) {
      const val = d.v[k];
      ev.push([d.t[k], val[0] === 'r' ? `r${val.slice(1)} ${id}` : v.width === 1 && val.length === 1 ? val + id : `b${val} ${id}`]);
    }
  }
  ev.sort((a, b) => a[0] - b[0]);
  let last = null;
  for (const [t, line] of ev) { if (t !== last) { out.push('#' + t); last = t; } out.push(line); }
  if (last !== S.wave.end) out.push('#' + S.wave.end);
  const data = { ...DATA, vcd: out.join('\n') + '\n', view: viewData(), focus: null,
    order: (DATA.order || []).filter((p) => keep.has(p)) };
  save(data);
}
$('#imageBtn').addEventListener('click', (e) => { const r = e.currentTarget.getBoundingClientRect(); imageMenu(r.left, r.bottom + 4); });
function exportImage(kind) {
  const { svg } = viewSvg(), base = S.file.replace(/\.vcd$/i, '');
  const said = (name) => { if (!hosted) toast(`Downloaded ${name}.`); };
  if (kind === 'svg') { saveFile(base + '.svg', 'image/svg+xml', svg); said(base + '.svg'); return; }
  pngCanvas((c) => {
    if (hosted) saveFile(base + '.png', 'image/png', c.toDataURL('image/png').split(',')[1]);
    else c.toBlob((b) => { saveFile(base + '.png', 'image/png', b); said(base + '.png'); }, 'image/png');
  });
}

/* ---------- The right-click menu ---------- */
// The viewer's own menu, with what makes sense for what was clicked (a
// signal's row, a group row, the time ruler, the signal list), in place
// of the browser's. Text fields keep the browser's menu, for Paste.
let ctx = null;
function closeMenu() { if (ctx) { ctx.remove(); ctx = null; } }
function openMenu(x, y, items, title) {

  if (title) el.insertAdjacentHTML('beforeend', `<div class="ttl">${esc(title)}</div>`);
  for (const it of items) {

    if (it.html) { const d = document.createElement('div'); d.className = 'sub'; d.innerHTML = it.html; d.addEventListener('click', (e) => { if (it.click(e) !== false) closeMenu(); }); el.appendChild(d); continue; }

    const box = it.checked != null;

    b.innerHTML = `${box ? '<span class="box"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : ''}<span>${esc(it.label)}</span>${it.key ? `<span class="k">${esc(it.key)}</span>` : ''}`;

  document.body.appendChild(el); ctx = el;
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
}
document.addEventListener('pointerdown', (e) => { if (ctx && !ctx.contains(e.target)) closeMenu(); }, true);
window.addEventListener('blur', closeMenu);
window.addEventListener('resize', closeMenu);
// Up and Down move through the items, Enter picks one, Escape closes.
document.addEventListener('keydown', (e) => {
  if (!ctx) return;
  const its = [...ctx.querySelectorAll('.it:not(:disabled)')], k = its.indexOf(document.activeElement);
  if (e.key === 'Escape') { closeMenu(); }
  else if (e.key === 'ArrowDown') its[(k + 1) % its.length]?.focus();
  else if (e.key === 'ArrowUp') its[(k - 1 + its.length) % its.length]?.focus();

}, true);
function copyText(t) { try { navigator.clipboard.writeText(t).catch(() => {}); } catch (_) {} }
const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl+';

// The selected rows (R46): S.sel, or the range from S.anchor to S.sel
// (Shift+click a name, Shift+Up and Shift+Down), a collapsed group's hidden
// rows included. Its first index and the one after its end.
function selSpan() {
  if (S.sel < 0 || !S.rows[S.sel]) return null;
  const a = S.anchor != null && S.rows[S.anchor] ? S.anchor : S.sel;
  const lo = Math.min(a, S.sel), hi = Math.max(a, S.sel);
  return { lo, end: hi + blockLen(hi) };
}
// The selected rows as moves and removals take them: a bit's bus with all
// its bits; null when only bits of one bus are selected (they can't be
// moved or removed alone).
function editSpan() {
  const sp = selSpan(); if (!sp) return null;
  const lo = busOf(sp.lo), last = busOf(sp.end - 1);
  if (lo === last && isBit(sp.lo)) return null;
  return { lo, end: last + blockLen(last) };
}
function isSel(i) { const sp = editSpan() || selSpan(); return !!sp && i >= sp.lo && i < sp.end; }
// A row and what moves with it: a collapsed group takes its hidden rows
// along, and stays collapsed (the user's request, 2026-11-21).
function blockLen(i) {
  const r = S.rows[i];
  if (r && r.v && r.expanded) { let n = 1; while (isBit(i + n)) n++; return n; }
  if (!r || r.kind !== 'group' || !r.collapsed) return 1;
  let j = i + 1; while (j < S.rows.length && S.rows[j].kind !== 'group') j++;
  return j - i;
}
// Where moved rows that hold a collapsed group may land: between groups or
// at the end, never inside another group's rows, which would then join the
// moved group (a group runs to the next group's row). Above the first group
// any place goes. Other moves land where asked.
function landing(lo, len, at) {
  // Never between a bus's bits: above the bus (the user's rule, 2026-11-22).
  if (at != null && isBit(at)) at = busOf(at);
  if (at == null || at >= S.rows.length || S.rows[at].kind === 'group') return at;
  if (!S.rows.slice(lo, lo + len).some((r) => r.kind === 'group' && r.collapsed)) return at;
  let g = at - 1; while (g >= 0 && S.rows[g].kind !== 'group') g--;
  if (g < 0 || (g >= lo && g < lo + len)) return at;
  if (at < lo) return g;
  let n = at; while (n < S.rows.length && S.rows[n].kind !== 'group') n++;
  return n;
}
// Moves `len` rows from `lo` so they land before the row now at index `at`
// (S.rows.length: at the end), keeping the selection on them.
function moveSpan(lo, len, at) {
  at = landing(lo, len, at);
  if (at == null || (at >= lo && at <= lo + len)) return;
  const sOff = S.sel - lo, aOff = S.anchor != null ? S.anchor - lo : null;
  const block = S.rows.splice(lo, len); if (at > lo) at -= len;
  S.rows.splice(at, 0, ...block);

}
// Moves row `from` with its block (a collapsed group's hidden rows); a row

function moveBlockTo(from, at) {
  const sp = editSpan();
  if (sp && from >= sp.lo && from < sp.end) { moveSpan(sp.lo, sp.end - sp.lo, at); return; }
  S.anchor = null; S.sel = from; moveSpan(from, blockLen(from), at);
}
// Alt+Up and Alt+Down: the selected rows past the next shown row, a
// collapsed group as one.
function moveRow(i, d) {
  const sp = editSpan(); if (!sp) return;
  const v = visible();
  if (d < 0) { const k = v.indexOf(sp.lo); if (k > 0) moveSpan(sp.lo, sp.end - sp.lo, busOf(v[k - 1])); return; }

// Removes the selected rows, a bus with its bits (Delete, and the menu of
// several rows).
function removeSelection() {
  const sp = editSpan(); if (!sp) return;
  S.rows.splice(sp.lo, sp.end - sp.lo); S.anchor = null; S.sel = -1; renderRows();
}
function removeRow(i) { S.rows.splice(i, S.rows[i] && S.rows[i].v ? blockLen(i) : 1); S.anchor = null; S.sel = -1; renderRows(); }
function timeItems(t) {
  return [
    { label: 'Put the cursor here', key: 'Click', act: () => setCursor(t) },
    { label: 'Put the marker here', key: 'Shift+click', act: () => { S.marker = Math.round(t); draw(); } },

}

    { html: `<div class="lbl">Color</div><div class="swatches">${[1, 2, 3, 4, 5, 6].map((c) => `<button data-color="${c}" style="--c:var(--s${c})" class="${r.color === c ? 'on' : ''}" aria-label="Color ${c}"></button>`).join('')}</div>`,
      click: (e) => { const b = e.target.closest('[data-color]'); if (!b) return false; r.color = +b.dataset.color; renderRows(); } },
    '-', ...common, '-',

// The menu of several selected rows: formats and colors for all their

  } else return false;
}
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('input, textarea, .pop, .dialog')) return;   // the browser's menu, for Paste
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if (e.target.closest('#tree')) { treeMenu(e); return; }
  if (e.target.closest('.cols.head > div')) {
    openMenu(x, y, [
      { label: valHidden() ? 'Show the Value column' : 'Hide the Value column', act: () => showVal(valHidden()) },
      { label: 'Reset column widths', act: resetWidths },
    ]);
    return;
  }
  const rowEl = e.target.closest('.nrow, .vrow');
  if (rowEl) { rowMenu(+rowEl.dataset.i, null, x, y); return; }
  if (e.target === waves) {
    const rect = waves.getBoundingClientRect(), i = rowAtY(y - rect.top);
    const t = snapAt(x - rect.left, y - rect.top, e.altKey).t;
    if (S.rows[i]) rowMenu(i, t, x, y); else timeMenu(t, x, y);
    return;
  }
  if (e.target === ruler || e.target.closest('.wavecol, .rows')) {
    const rect = waves.getBoundingClientRect(); timeMenu(timeAtX(Math.max(0, x - rect.left)), x, y); return;
  }
  closeMenu();
});

/* ---------- More room for the waves ---------- */
// Per-viewer conveniences, kept in this browser only.
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const COL = { name: { prop: '--name-w', def: 210, min: 80, max: 520 }, val: { prop: '--val-w', def: 92, min: 0, max: 300 } };
const STRIP = 18;   // the width of a hidden Value column's strip
function setCol(col, w) {
  const c = COL[col];
  w = Math.round(Math.max(c.min, Math.min(c.max, w)));
  if (col === 'val' && w < 28) w = 0;   // dragged almost to nothing: hidden
  document.documentElement.style.setProperty(c.prop, (col === 'val' && w === 0 ? STRIP : w) + 'px');
  if (col === 'val') {
    $('#app').classList.toggle('val-hidden', w === 0);
    // Too narrow for even a cut title: only the chevron stays.
    $('#app').classList.toggle('val-narrow', w > 0 && w < 44);
  }
  store.set('wv.' + col, String(w));
}
const valHidden = () => $('#app').classList.contains('val-hidden');
// The width the Value column comes back at: its width before it was hidden.
function rememberVal(w) { if (w >= 28) store.set('wv.valLast', String(Math.round(w))); }
function showVal(on) {
  if (!on && !valHidden()) rememberVal(colWidth('val'));
  setCol('val', on ? +(store.get('wv.valLast') || COL.val.def) : 0);
}
function resetWidths() { setCol('name', COL.name.def); setCol('val', COL.val.def); }
function colWidth(col) {
  if (col === 'val' && valHidden()) return 0;
  const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(COL[col].prop));
  return Number.isNaN(w) ? COL[col].def : w;
}
$('#valOpen').onclick = () => showVal(true);
$('#valClose').onclick = () => showVal(false);
$('#vals').addEventListener('click', () => { if (valHidden()) showVal(true); });
for (const col of ['name', 'val']) { const w = store.get('wv.' + col); if (w != null) setCol(col, +w); }
document.querySelectorAll('.grip').forEach((g) => {
  const col = g.dataset.col;
  g.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, w0 = colWidth(col); g.classList.add('active');
    if (col === 'val') rememberVal(w0); g.setPointerCapture(e.pointerId);
    const move = (ev) => setCol(col, w0 + ev.clientX - x0);
    const up = () => { g.classList.remove('active'); g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
  });
  g.addEventListener('dblclick', (e) => { e.stopPropagation(); setCol(col, COL[col].def); });
});
function setBrowser(shown) {
  $('#app').classList.toggle('no-browser', !shown);
  const b = $('#sideBtn'); b.classList.toggle('on', shown); b.setAttribute('aria-pressed', String(shown));
  b.title = shown ? 'Hide the signal list, for more room (S)' : 'Show the signal list (S)';
  b.setAttribute('aria-label', shown ? 'Hide the signal list' : 'Show the signal list');
  store.set('wv.browser', shown ? '1' : '0');
}
setBrowser(store.get('wv.browser') !== '0');
// Hints for people new to the viewer (the mouse hints at the bottom, the
// one under the signal list), which experienced users may hide (R47): a
// per-user choice, kept in the browser, not in the view.
function hintsShown() { return !$('#app').classList.contains('no-hints'); }
function setHints(on) {
  $('#app').classList.toggle('no-hints', !on); store.set('wv.hints', on ? '1' : '0');
  placeHelp();
}
setHints(store.get('wv.hints') !== '0');
// The signal list's button: in a wide window it shows or hides the list
// beside the waves; in a narrow one, where the list is hidden for room, it
// opens the list over the waves (the same button in both, the user's
// choice, 2026-11-22, over a separate Signals button).
const narrow = window.matchMedia('(max-width: 760px)');
function toggleBrowser() {
  if (narrow.matches) {
    const open = $('#app').classList.toggle('show-browser');
    $('#sideBtn').classList.toggle('on', open);
  } else {
    setBrowser($('#app').classList.contains('no-browser'));
  }
}
narrow.addEventListener('change', () => {
  $('#app').classList.remove('show-browser');
  $('#sideBtn').classList.toggle('on', !narrow.matches && !$('#app').classList.contains('no-browser'));
});
if (narrow.matches) $('#sideBtn').classList.remove('on');
$('#sideBtn').onclick = toggleBrowser;

function placeGrips() {
  const head = document.querySelector('.cols.head'), status = $('#status'), viewer = $('#viewer');
  viewer.style.setProperty('--grips-top', head.offsetTop + 'px');
  viewer.style.setProperty('--grips-bottom', (viewer.clientHeight - status.offsetTop) + 'px');
}
new ResizeObserver(() => { placeGrips(); draw(); }).observe($('#wavecol'));
new ResizeObserver(placeGrips).observe($('#viewer'));
placeGrips();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts) document.fonts.ready.then(draw);
if (DATA) load();
})();
</script>
