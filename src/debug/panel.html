<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logix Debug</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e3e2de; --accent: #2f6fdb; --accent-text: #ffffff;
    --on: #1f9d55; --off: #8a8a84; --warn-bg: #fdecea; --warn: #a12a1f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9a9993;
      --line: #33332f; --accent: #5b8ff0; --accent-text: #0b0b0a;
      --on: #3ccf7a; --off: #6f6f6a; --warn-bg: #3a1d1a; --warn: #f2a59c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .spacer { flex: 1; }
  main { padding: 16px 20px; display: grid; gap: 16px; max-width: 1100px; }
  /* Collapsible sections: the title folds and unfolds its table. */
  details.section > summary {
    margin: 0 0 8px; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; list-style: none; user-select: none; width: fit-content;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before {
    content: ""; width: 0; height: 0; border-style: solid;
    border-width: 5px 0 5px 7px; border-color: transparent transparent transparent currentColor;
    transition: transform .15s;
  }
  details.section[open] > summary::before { transform: rotate(90deg); }
  details.section:not([open]) > summary { margin-bottom: 0; }
  /* Each table, and its box, as wide as its content. */
  .card { display: inline-block; max-width: 100%; vertical-align: top; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; }
  /* Cells' side padding: --pad-x, wider in the Watch table. */
  table { --pad-x: 20px; }
  #watch { --pad-x: 28px; }
  th, td { text-align: left; padding: 8px var(--pad-x); border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th + th, td + td { border-left: 1px solid var(--line); }
  thead th { border-bottom: 1px solid var(--line); }
  th.num { text-align: right; }
  th.center { text-align: center; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  td.mono, .mono { font-family: var(--mono); }
  td.num { text-align: right; }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: 0 2px 8px rgb(0 0 0 / .15); max-width: 360px;
  }
  #tip.mono { font-family: var(--mono); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.on { color: var(--on); border-color: var(--on); }
  .pill.off { color: var(--off); }
  /* A pulse the board took: the state pill flashes, then fades back. */
  .pill.flash { animation: flash 175ms ease-out; }
  @keyframes flash {
    0%, 25% {
      background: color-mix(in srgb, var(--accent) 50%, white);
      border-color: color-mix(in srgb, var(--accent) 50%, white);
      color: #1a1a18;
    }
  }
  button, input[type=text] {
    font: inherit; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 4px 10px;
  }
  input[type=text] { font-family: var(--mono); width: 9em; }
  input[type=text].invalid { border-color: var(--warn); background: var(--warn-bg); outline-color: var(--warn); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .controls { display: flex; gap: 6px; align-items: center; }
  #pause { min-width: 6.5em; }
  /* The panel's status, a badge: live, paused, stale or offline. */
  #status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; color: var(--muted);
  }
  #status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  #status.live { color: var(--on); border-color: var(--on); background: color-mix(in srgb, var(--on) 12%, transparent); }
  #status.live::before { animation: pulse 1.6s ease-in-out infinite; }
  #status.stale, #status.offline { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  @keyframes pulse { 50% { opacity: .35; } }
  #error {
    display: none; align-items: flex-start; gap: 10px; margin: 0;
    padding: 10px 10px 10px 14px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn);
  }
  #error-text { flex: 1; white-space: pre-wrap; }
  #error-close {
    border: none; background: none; color: inherit; padding: 0 4px;
    font-size: 18px; line-height: 1; cursor: pointer; opacity: .7;
  }
  #error-close:hover { opacity: 1; }
  .empty { padding: 12px 14px; color: var(--muted); }
  /* The live plot: as wide as the page, a row per watched net. */
  .plot-tools { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .plot-card { display: block; position: relative; }
  #plot { display: block; width: 100%; cursor: crosshair; }
  select { font: inherit; }
  select.fmt { font-size: 13px; padding: 1px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Logix Debug</h1>
  <span id="status"></span>
  <!-- Shown only when several debug sessions are open, such as two boards. -->
  <span class="meta" id="session-box" hidden>Session <select id="session"></select></span>
  <span class="meta">Board <b id="board">–</b></span>
  <span class="meta">Port <b id="port">–</b></span>
  <span class="spacer"></span>
  <!-- Not round periods: a design's own periods, such as a blinky's half
       second, would otherwise show the same phase at every read. -->
  <select id="rate" title="Refresh rate">
    <option value="19">50 per second</option>
    <option value="47">20 per second</option>
    <option value="97">10 per second</option>
    <option value="197">5 per second</option>
    <option value="491">2 per second</option>
    <option value="973" selected>1 per second</option>
    <option value="1973">every 2 seconds</option>
    <option value="4931">every 5 seconds</option>
    <option value="9967">every 10 seconds</option>
    <option value="29959">every 30 seconds</option>
    <option value="59957">every 60 seconds</option>
  </select>
  <button id="pause" title="Stop or restart the live updates">Pause</button>
  <button id="refresh">Read now</button>
</header>
<main>
  <div id="error" role="alert"><span id="error-text"></span><button id="error-close" title="Dismiss" aria-label="Dismiss">×</button></div>
  <details class="section" id="section-drive" open>
    <summary>Drive</summary>
    <div class="card">
      <div class="scroll"><table id="drive">
        <thead><tr><th>Name</th><th class="num">Bits</th><th class="center">Format</th><th>State</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="no-drive" hidden>This build drives no nets.</div>
    </div>
  </details>
  <details class="section" id="section-watch" open>
    <summary>Watch</summary>
    <div class="card">
      <div class="scroll"><table id="watch">
        <thead><tr><th>Name</th><th class="num">Bits</th><th class="center">Format</th><th class="num">Value</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="no-watch" hidden>This build watches no nets.</div>
    </div>
  </details>
  <details class="section" id="section-plot" open>
    <summary>Plot</summary>
    <div class="plot-tools">
      <!-- What the panel reads, at its refresh rate: a strip chart, not a
           logic analyzer; changes faster than the refresh don't show. -->
      Last
      <select id="plot-window" title="How much time the plot shows">
        <option value="10000">10 seconds</option>
        <option value="30000" selected>30 seconds</option>
        <option value="60000">1 minute</option>
        <option value="300000">5 minutes</option>
      </select>
      <button id="plot-clear" title="Start the plot over">Clear</button>
      <span>Sampled at the refresh rate: faster changes don't show.</span>
    </div>
    <div class="card plot-card"><canvas id="plot" height="60"></canvas></div>
  </details>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  let session = params.get("session") || "";
  let built = "";      // the session and build the tables were made for
  let busy = false;
  let timer = null;
  let paused = false;
  let lastRead = null;  // when the last read came back, in ms
  const $ = (id) => document.getElementById(id);

  // True while the page can't reach the program serving it, whose name
  // comes from /api/about, asked at load.
  let offline = false;
  let server = { name: "the server" };

  // A request to the server. A failure to reach it at all (it stopped)
  // and an error it reports (such as the board not answering) give
  // different messages.
  function api(path, opts = {}) {
    const sep = path.includes("?") ? "&" : "?";
    return fetch(`${path}${sep}t=${encodeURIComponent(token)}`, opts).then(async (r) => {
      offline = false;
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error?.message || `${server.name} answered HTTP ${r.status}.`);
      return body;
    }, () => {
      offline = true;
      showStatus();
      throw new Error(`Can't reach ${server.name}: it was stopped or closed.`);
    });
  }

  // The error banner. A dismissed message stays hidden while it repeats
  // (each refresh may report it again); a different one shows, and so does
  // the same one once things went well in between.
  let dismissed = null;
  function showError(e) {
    const el = $("error");
    if (!e) {
      dismissed = null;
      el.style.display = "none";
      return;
    }
    const text = e.message || String(e);
    if (text === dismissed) return;
    $("error-text").textContent = text;
    el.style.display = "flex";
  }
  $("error-close").onclick = () => {
    dismissed = $("error-text").textContent;
    $("error").style.display = "none";
  };

  function cell(text, cls) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    td.textContent = text;
    return td;
  }

  // The name, with the net's path as its hover text.
  function nameCell(name, net) {
    const td = cell(name, "name");
    td.dataset.tip = net;
    return td;
  }

  // Each row's format, watched or driven: the one chosen in its menu
  // (remembered by name in this browser), else the debug file's, else
  // decimal for one bit and hex for more.
  const FORMATS = [["hex", "Hex"], ["dec", "Decimal"], ["bin", "Binary"]];
  const FORMATS_KEY = "logix-debug-panel.formats";
  let formats = {};
  try { formats = JSON.parse(localStorage.getItem(FORMATS_KEY) || "{}") || {}; } catch { formats = {}; }
  function formatOf(name, width, fileFormat) {
    return formats[name] || fileFormat || (width === 1 ? "dec" : "hex");
  }
  function saveFormat(name, fmt) {
    formats[name] = fmt;
    try { localStorage.setItem(FORMATS_KEY, JSON.stringify(formats)); } catch { /* kept for this page only */ }
  }

  // A value, from its bits (most significant first), in a format.
  function shown(bits, fmt) {
    if (!bits) return "";
    if (fmt === "bin") return bits;
    const n = BigInt("0b" + bits);
    if (fmt === "dec") return n.toString();
    return "0x" + n.toString(16).padStart(Math.ceil(bits.length / 4), "0");
  }

  // A row's format menu; onChange gets the new format.
  function formatCell(name, width, fileFormat, onChange) {
    const td = document.createElement("td");
    const sel = document.createElement("select");
    sel.className = "fmt";
    sel.title = `Format of ${name}`;
    for (const [v, label] of FORMATS) {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = label;
      sel.append(o);
    }
    sel.value = formatOf(name, width, fileFormat);
    sel.onchange = () => {
      saveFormat(name, sel.value);
      onChange(sel.value);
    };
    td.append(sel);
    return td;
  }

  // A typed drive value, read in the row's format unless it has its own
  // 0x or 0b prefix, as the text write_debug takes.
  function typedValue(text, fmt) {
    const t = text.trim().replace(/_/g, "");
    if (/^0[xb]/i.test(t) || fmt === "dec") return t;
    return (fmt === "hex" ? "0x" : "0b") + t;
  }
  const PLACEHOLDERS = { hex: "hex", dec: "decimal", bin: "binary" };
  const VALUE_TIP = "A value in the row's format, or with a 0x or 0b prefix";
  const BASE_NAMES = { hex: "hex", dec: "decimal", bin: "binary" };

  // Why a typed value can't be driven on a net of `width` bits, or null.
  // An empty box is an error only when `onDrive`.
  function valueError(text, fmt, width, onDrive) {
    const t = text.trim().replace(/_/g, "");
    if (!t) return onDrive ? "Enter a value first." : null;
    let base = fmt;
    let digits = t;
    if (/^0x/i.test(t)) { base = "hex"; digits = t.slice(2); }
    else if (/^0b/i.test(t)) { base = "bin"; digits = t.slice(2); }
    const ok = { hex: /^[0-9a-f]+$/i, dec: /^[0-9]+$/, bin: /^[01]+$/ }[base];
    if (!ok.test(digits)) return `Not a ${BASE_NAMES[base]} number.`;
    const prefix = base === "hex" ? "0x" : base === "bin" ? "0b" : "";
    const max = (1n << BigInt(width)) - 1n;
    if (BigInt(prefix + digits) > max) {
      const radix = { hex: 16, dec: 10, bin: 2 }[base];
      return `Too large for ${width} bit${width === 1 ? "" : "s"}: at most ${prefix}${max.toString(radix)}.`;
    }
    return null;
  }

  // The value cell is as wide as the format's longest value for the net,
  // so the column keeps its width as the value changes.
  function sizeValue(td, width, fmt) {
    const chars = fmt === "bin" ? width
      : fmt === "dec" ? Math.max(1, Math.ceil(width * Math.log10(2)))
      : 2 + Math.ceil(width / 4);
    td.style.width = `calc(${chars}ch + 2 * var(--pad-x) + 2px)`;  // + padding, border and slack
  }

  // The net's path, at once, next to the pointer (the browser's own title
  // text comes late or not at all).
  const tip = document.createElement("div");
  tip.id = "tip";
  document.body.append(tip);
  document.addEventListener("mouseover", (e) => {
    const td = e.target.closest?.("[data-tip]");
    if (!td) { tip.style.display = "none"; return; }
    tip.textContent = td.dataset.tip;
    tip.classList.toggle("mono", td.classList.contains("name"));
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", (e) => {
    if (tip.style.display !== "block") return;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${e.clientY + 16}px`;
  });

  function build(info) {
    const ib = $("watch").tBodies[0], ob = $("drive").tBodies[0];
    ib.replaceChildren(); ob.replaceChildren();
    for (const i of info.watch) {
      const tr = document.createElement("tr");
      tr.dataset.name = i.name;
      const value = cell("", "mono num value");
      const fmtCell = formatCell(i.name, i.width, i.format, (fmt) => {
        sizeValue(value, i.width, fmt);
        value.textContent = shown(tr.dataset.bits, fmt);
        drawPlot();
      });
      sizeValue(value, i.width, fmtCell.firstChild.value);
      tr.append(nameCell(i.name, i.net), cell(String(i.width), "num"), fmtCell, value);
      ib.append(tr);
    }
    for (const o of info.drive) {
      const tr = document.createElement("tr");
      tr.dataset.name = o.name;
      const state = cell("");
      state.className = "state";
      const ctl = document.createElement("td");
      let inp = null;
      let check = () => null;
      const fmtCell = formatCell(o.name, o.width, o.format, (fmt) => {
        if (inp) {
          inp.placeholder = PLACEHOLDERS[fmt];
          check(false);
        }
        showDriveState(tr);
      });
      const box = document.createElement("div");
      box.className = "controls";
      if (o.width === 1) {
        for (const v of ["0", "1"]) {
          const b = document.createElement("button");
          b.textContent = v;
          b.title = `Drive ${o.name} to ${v}`;
          b.onclick = () => write({ name: o.name, value: Number(v) });
          box.append(b);
        }
        const p = document.createElement("button");
        p.textContent = "Pulse";
        p.title = `Flip ${o.name} for one clock, driven or released`;
        p.onclick = async () => { if (await write({ name: o.name, pulse: true })) flash(tr); };
        box.append(p);
      } else {
        inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = PLACEHOLDERS[fmtCell.firstChild.value];
        inp.dataset.tip = VALUE_TIP;
        const b = document.createElement("button");
        b.textContent = "Drive";
        // Checked as typed; an empty box only when Drive is pressed.
        check = (onDrive) => {
          const err = valueError(inp.value, fmtCell.firstChild.value, o.width, onDrive);
          inp.classList.toggle("invalid", Boolean(err));
          inp.dataset.tip = err || VALUE_TIP;
          return err;
        };
        inp.oninput = () => check(false);
        const go = () => {
          if (check(true)) {
            inp.focus();
            return;
          }
          write({ name: o.name, value: typedValue(inp.value, fmtCell.firstChild.value) });
        };
        b.onclick = go;
        inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
        box.append(inp, b);
      }
      const r = document.createElement("button");
      r.textContent = "Release";
      r.className = "release";
      r.title = `Give ${o.name} back to the design`;
      r.onclick = () => write({ name: o.name, release: true });
      box.append(r);
      ctl.append(box);
      tr.append(nameCell(o.name, o.net), cell(String(o.width), "num"),
        fmtCell, state, ctl);
      ob.append(tr);
    }
    $("no-watch").hidden = info.watch.length > 0;
    $("no-drive").hidden = info.drive.length > 0;
  }

  // A drive row's state, in its format: read back from the board, or, when
  // it couldn't be, what was last written, marked unconfirmed.
  function showDriveState(tr) {
    const td = tr.querySelector(".state");
    const driven = tr.dataset.driven === "1";
    const fmt = tr.querySelector(".fmt").value;
    const text = (driven ? `driven ${shown(tr.dataset.bits, fmt)}` : "released")
      + (tr.dataset.verified ? "" : " (unconfirmed)");
    let pill = td.firstChild;
    if (!pill) {
      pill = document.createElement("span");
      td.append(pill);
    }
    // classList, not className, so a running flash isn't cut short.
    pill.classList.add("pill");
    pill.classList.toggle("on", driven);
    pill.classList.toggle("off", !driven);
    if (pill.textContent !== text) pill.textContent = text;
    if (tr.dataset.verified) delete pill.dataset.tip;
    else pill.dataset.tip = "Not read from the board (it didn't answer): what was last written.";
    const rel = tr.querySelector(".release");
    if (rel) rel.disabled = !driven;
  }

  // Flashes a drive row's state pill, from the start on every call.
  function flash(tr) {
    const pill = tr.querySelector(".state .pill");
    if (!pill) return;
    pill.classList.remove("flash");
    void pill.offsetWidth;  // restarts the animation
    pill.classList.add("flash");
    pill.addEventListener("animationend", () => pill.classList.remove("flash"), { once: true });
  }

  function setText(td, text) {
    if (td.textContent !== text) td.textContent = text;
  }

  function render(state) {
    const info = state.info;
    const key = `${info.session}/${info.build_id}`;
    if (key !== built) { build(info); built = key; }
    $("board").textContent = info.board;
    $("port").textContent = info.port;
    for (const v of state.values) {
      const tr = $("watch").querySelector(`tr[data-name="${CSS.escape(v.name)}"]`);
      if (!tr) continue;
      tr.dataset.bits = v.bits;
      setText(tr.querySelector(".value"), shown(v.bits, tr.querySelector(".fmt").value));
    }
    for (const o of info.drive) {
      const tr = $("drive").querySelector(`tr[data-name="${CSS.escape(o.name)}"]`);
      if (!tr) continue;
      tr.dataset.driven = o.driven ? "1" : "";
      tr.dataset.bits = o.bits;
      tr.dataset.verified = info.verified ? "1" : "";
      showDriveState(tr);
    }
    if (state.values.length) {
      lastRead = Date.now();
      showStatus();
      addSample(lastRead, state.values);
    }
  }

  async function refresh(read = true) {
    if (busy || !session) return;
    busy = true;
    try {
      render(await api(`/api/state?session=${encodeURIComponent(session)}&read=${read ? 1 : 0}`));
      showError(null);
    } catch (e) {
      showError(e);
      if (read) addGap(Date.now());
    } finally {
      busy = false;
    }
  }

  // Writes, then refreshes; true when the board took it.
  async function write(body) {
    let ok = false;
    try {
      await api("/api/write", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, ...body }),
      });
      showError(null);
      ok = true;
    } catch (e) {
      showError(e);
    }
    refresh(!paused);
    return ok;
  }

  // The panel's status: "Live" while reads keep coming, "Paused", or
  // how old the data is in coarse steps, so the text changes rarely. The
  // exact time of the last read is in its tooltip.
  function age(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 30) return `${Math.max(5, Math.floor(s / 5) * 5)} s ago`;
    if (s < 60) return "30 s ago";
    const m = Math.floor(s / 60);
    if (m < 60) return `${m} min ago`;
    return `${Math.floor(m / 60)} h ago`;
  }

  function showStatus() {
    const el = $("status");
    let text;
    let kind = "";
    if (offline) {
      text = `${server.name} stopped`;
      kind = "offline";
    } else if (paused) text = "Paused";
    else if (lastRead === null) text = "Reading…";
    else {
      const ms = Date.now() - lastRead;
      const live = ms < staleAfter();
      text = live ? "Live" : age(ms);
      kind = live ? "live" : "stale";
    }
    if (el.textContent !== text) el.textContent = text;
    el.className = kind;
    const last = lastRead === null ? "Not read yet" : `Last read at ${new Date(lastRead).toLocaleTimeString()}`;
    el.dataset.tip = offline ? `The page can't reach ${server.name}. ${last}.` : last;
  }
  setInterval(showStatus, 1000);

  function schedule() {
    clearInterval(timer);
    if (!paused) timer = setInterval(() => refresh(true), Number($("rate").value));
  }

  async function sessions() {
    try {
      const { sessions } = await api("/api/sessions");
      const sel = $("session");
      sel.replaceChildren();
      for (const s of sessions) {
        const o = document.createElement("option");
        o.value = o.textContent = s;
        sel.append(o);
      }
      if (!sessions.includes(session)) session = sessions[0] || "";
      sel.value = session;
      $("session-box").hidden = sessions.length < 2;
      if (!session) showError(new Error("No debug session is open. Open one with open_debug, then reload."));
    } catch (e) {
      showError(e);
    }
  }

  $("session").onchange = (e) => { session = e.target.value; built = ""; refresh(true); };
  // Each section's folded state, remembered in this browser.
  for (const id of ["section-drive", "section-watch", "section-plot"]) {
    const el = $(id);
    const key = `logix-debug-panel.${id}`;
    try { if (localStorage.getItem(key) === "closed") el.open = false; } catch { /* open */ }
    el.addEventListener("toggle", () => {
      try { localStorage.setItem(key, el.open ? "open" : "closed"); } catch { /* not kept */ }
    });
  }

  $("pause").onclick = () => {
    // Resumed: the values before the pause end at it (or at a read made
    // with Refresh while paused), not staleAfter later.
    if (paused) addGap(Math.max(pausedAt, samples.length ? samples[samples.length - 1].t : 0));
    paused = !paused;
    pausedAt = paused ? Date.now() : null;
    $("pause").textContent = paused ? "Resume" : "Pause";
    $("pause").classList.toggle("primary", paused);
    showStatus();
    schedule();
  };
  $("rate").onchange = schedule;
  $("refresh").onclick = () => refresh(true);

  api("/api/about").then((about) => { if (about.name) server = about; }).catch(() => {});
  // --- The live plot -------------------------------------------------------
  // Every read's watched values, with their time, kept for the longest
  // window; drawn as a row per net: one bit as a high/low trace, more as a
  // stepped line scaled to the values in view, with the value at the right
  // in the row's format. A pointer over it shows that moment's time and
  // values. Paused, it stays at the moment of the pause.

  const PLOT_KEEP = 300000;  // ms: the longest window
  let samples = [];          // { t, bits: { name: "0101" } }
  let pausedAt = null;
  let hoverX = null;
  const LABEL_W = 150, VALUE_W = 190, ROW_H = 51, AXIS_H = 24;

  // Late by three periods (at least 5 s): no longer live. A sample's
  // values hold on the plot until the next read, a failed read or this,
  // whichever comes first: past that there is no data, so no line.
  function staleAfter() {
    return Math.max(3 * Number($("rate").value), 5000);
  }

  function keep(entry) {
    samples.push(entry);
    const oldest = entry.t - PLOT_KEEP;
    if (samples[0].t < oldest) samples = samples.filter((x) => x.t >= oldest);
    drawPlot();
  }

  function addSample(t, values) {
    const bits = {};
    for (const v of values) bits[v.name] = v.bits;
    keep({ t, bits });
  }

  // A failed read or a pause: the values before it end there.
  function addGap(t) {
    if (samples.length && !samples[samples.length - 1].gap) keep({ t, gap: true });
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // The watched rows, in the Watch table's order, with their widths and
  // formats.
  function plotRows() {
    return [...$("watch").tBodies[0].rows].map((tr) => ({
      name: tr.dataset.name,
      width: Number(tr.cells[1].textContent),
      fmt: tr.querySelector(".fmt").value,
    }));
  }

  // The sample whose values hold at t (by binary search), or null where
  // there is no data.
  function sampleAt(t) {
    let lo = 0, hi = samples.length - 1, found = null;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (samples[mid].t <= t) { found = samples[mid]; lo = mid + 1; } else hi = mid - 1;
    }
    return found && !found.gap && t - found.t <= staleAfter() ? found : null;
  }

  function lastSample() {
    for (let k = samples.length - 1; k >= 0; k--) if (!samples[k].gap) return samples[k];
    return null;
  }

  function drawPlot() {
    const canvas = $("plot");
    if (!$("section-plot").open) return;
    const rows = plotRows();
    const cssW = canvas.clientWidth;
    const cssH = Math.max(1, rows.length) * ROW_H + AXIS_H;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.height = `${cssH}px`;
    }
    const g = canvas.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cssW, cssH);
    const text = cssVar("--text"), muted = cssVar("--muted"), line = cssVar("--line"), trace = cssVar("--on"), accent = cssVar("--accent");
    const mono = getComputedStyle(document.body).getPropertyValue("--mono") || "monospace";
    const span = Number($("plot-window").value);
    const end = pausedAt ?? Date.now();
    const start = end - span;
    const x0 = LABEL_W, x1 = Math.max(x0 + 50, cssW - VALUE_W);
    const xOf = (t) => x0 + ((t - start) / span) * (x1 - x0);
    const hoverT = hoverX !== null && hoverX >= x0 && hoverX <= x1 ? start + ((hoverX - x0) / (x1 - x0)) * span : null;
    const shownAt = hoverT !== null ? sampleAt(hoverT) : lastSample();
    const limit = staleAfter();

    // The samples in view, and the one just before, so lines start at the
    // left edge.
    let first = samples.findIndex((x) => x.t >= start);
    if (first === -1) first = samples.length;
    const view = samples.slice(Math.max(0, first - 1)).filter((x) => x.t <= end);

    g.font = "13px system-ui, -apple-system, sans-serif";
    g.textBaseline = "middle";
    if (!rows.length) {
      g.fillStyle = muted;
      g.fillText("This build watches no nets.", 12, ROW_H / 2);
    }
    rows.forEach((row, i) => {
      const top = i * ROW_H, yHi = top + 7, yLo = top + ROW_H - 7;
      g.strokeStyle = line;
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, top + ROW_H + 0.5); g.lineTo(cssW, top + ROW_H + 0.5); g.stroke();
      g.fillStyle = text;
      g.fillText(row.name, 12, top + ROW_H / 2, LABEL_W - 20);
      // The values in view, as numbers (null at failed reads).
      const pts = view.filter((x) => x.gap || x.bits[row.name] !== undefined)
        .map((x) => ({ t: x.t, n: x.gap ? null : Number(BigInt("0b" + x.bits[row.name])) }));
      const ns = pts.filter((p) => p.n !== null).map((p) => p.n);
      if (ns.length) {
        let lo = 0, hi = 1;
        if (row.width > 1) {
          lo = Math.min(...ns);
          hi = Math.max(...ns);
        }
        const yOf = (n) => (hi === lo ? (yHi + yLo) / 2 : yLo - ((n - lo) / (hi - lo)) * (yLo - yHi));
        g.save();
        g.beginPath(); g.rect(x0, top, x1 - x0, ROW_H); g.clip();
        g.strokeStyle = trace;
        g.lineWidth = 1.5;
        g.beginPath();
        pts.forEach((p, k) => {
          if (p.n === null) return;
          // Each value holds until the next read, a failed read or
          // staleAfter, and the last up to now (or the pause).
          const next = pts[k + 1], prev = pts[k - 1];
          const until = Math.min(next ? next.t : end, p.t + limit);
          const x = Math.max(x0, xOf(p.t)), y = yOf(p.n);
          // Joined to the previous value only when it held up to here.
          if (prev && prev.n !== null && p.t - prev.t <= limit) g.lineTo(x, y);
          else g.moveTo(x, y);
          g.lineTo(Math.min(x1, xOf(until)), y);
        });
        g.stroke();
        g.restore();
      }
      const b = shownAt?.bits[row.name];
      if (b !== undefined) {
        g.fillStyle = hoverT !== null ? accent : text;
        g.font = `13px ${mono}`;
        g.textAlign = "right";
        g.fillText(shown(b, row.fmt), cssW - 12, top + ROW_H / 2, VALUE_W - 20);
        g.textAlign = "left";
        g.font = "13px system-ui, -apple-system, sans-serif";
      }
    });

    // The time axis: seconds before now (or the pause).
    const axisY = rows.length * ROW_H + AXIS_H / 2;
    g.fillStyle = muted;
    g.font = "12px system-ui, -apple-system, sans-serif";
    const step = span / 5;
    for (let k = 0; k <= 5; k++) {
      const t = start + k * step, x = xOf(t);
      g.strokeStyle = line;
      g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, rows.length * ROW_H); g.stroke();
      const ago = (end - t) / 1000;
      const label = k === 5 ? (pausedAt ? "paused" : "now") : ago >= 60 ? `−${ago / 60} min` : `−${ago} s`;
      g.textAlign = k === 0 ? "left" : k === 5 ? "right" : "center";
      g.fillText(label, x, axisY);
    }
    g.textAlign = "left";

    // The pointer's moment.
    if (hoverT !== null) {
      g.strokeStyle = accent;
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(hoverX + 0.5, 0); g.lineTo(hoverX + 0.5, rows.length * ROW_H); g.stroke();
      const ago = ((end - hoverT) / 1000).toFixed(1);
      g.fillStyle = accent;
      g.textAlign = "right";
      g.fillText(`−${ago} s`, cssW - 12, axisY);
      g.textAlign = "left";
    }
  }

  $("plot").addEventListener("mousemove", (e) => {
    hoverX = e.clientX - $("plot").getBoundingClientRect().left;
    drawPlot();
  });
  $("plot").addEventListener("mouseleave", () => { hoverX = null; drawPlot(); });
  $("plot-window").onchange = drawPlot;
  $("plot-clear").onclick = () => { samples = []; drawPlot(); };
  $("section-plot").addEventListener("toggle", drawPlot);
  window.addEventListener("resize", drawPlot);
  // The time axis moves on between reads.
  setInterval(() => { if (!pausedAt) drawPlot(); }, 250);

  sessions().then(() => { refresh(true); schedule(); });
})();
</script>
</body>
</html>
