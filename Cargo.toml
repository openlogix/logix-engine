[package]
name = "logix-engine"
# Not used for releases: the engine version is a date tag, set by build.rs.
version = "0.0.0"
edition = "2024"
description = "One open engine to build, test and program FPGAs, for any IDE or AI agent."
license = "Apache-2.0"
repository = "https://github.com/openlogix/logix-engine"
homepage = "https://www.openlogix.org/engine/"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
regex = "1"
reqwest = "0.13"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "sync", "time", "fs"] }
tokio-util = "0.7"

[dev-dependencies]
jsonschema = "0.60"
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }

[profile.release]
strip = true
