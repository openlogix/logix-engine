[package]
name = "logix-engine"
# Not used for releases: the engine version is a date tag, set by build.rs.
version = "0.0.0"
edition = "2024"
description = "One open engine to build and test FPGA designs and program boards, for any IDE or AI agent."
license = "MIT OR Apache-2.0"
repository = "https://github.com/openlogix/logix-engine"
homepage = "https://www.openlogix.org/engine/"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# Canonical paths without Windows' \\?\ prefix, which tools can't use.
dunce = "1"
flate2 = "1"
hex = "0.4"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
regex = "1"
reqwest = "0.13"
# QuickJS, to run ELK (logix-core's elkjs), which lays out the diagrams.
rquickjs = "0.9"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
rusb = { version = "0.9", features = ["vendored"] }
schemars = { version = "1", features = ["indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "sync", "time", "fs"] }
tokio-util = "0.7"

# Windows: a Job Object per tool, so Stop ends its whole process tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = "0.60"
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }

[profile.release]
strip = true

# Dependencies are built without debug info, which keeps the build folder
# much smaller. The project's own code keeps it, so crashes and debuggers
# still show its lines.
[profile.dev.package."*"]
debug = false
